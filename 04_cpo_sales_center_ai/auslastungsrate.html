<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auslastungsrate · CPO Sales Center AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Maven Pro', system-ui, sans-serif; background: #0E0E14; color: #fff; min-height: 100vh; padding: 72px 16px 32px; display: flex; flex-direction: column; }
    .back-btn { position: fixed; top: 16px; left: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: #1B1B22; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #ccc; font: 600 13px/1 'Maven Pro', system-ui, sans-serif; text-decoration: none; transition: background .2s; z-index: 100; }
    .back-btn:hover { background: #2a2a35; }
    .lang-toggle { position: fixed; top: 16px; right: 20px; display: flex; gap: 6px; z-index: 100; }
    .lang-btn { background: transparent; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 5px 11px; cursor: pointer; font: 600 12px/1.4 'Maven Pro', system-ui, sans-serif; color: rgba(255,255,255,.45); transition: all .15s; display: flex; align-items: center; gap: 4px; }
    .lang-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
    .lang-btn.active { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.35); color: #fff; font-weight: 800; }
    h1 { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #F39A3A, #E32028, #6D2A99); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; }
    .page-wrap { max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .report-card { background: #1B1B22; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 600px; }
    .report-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px; }
    .report-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; }
    .report-header span { font-size: 12px; color: #6B6B76; }
    iframe { width: 100%; flex: 1; border: none; min-height: 560px; background: #0E0E14; }
    .iframe-loading { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #6B6B76; font-size: 14px; min-height: 400px; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(109,42,153,.3); border-top-color: #9B59B6; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; margin-top: 20px; font-size: 12px; color: #3A3A3C; }
  </style>
</head>
<body>
  <a class="back-btn" href="index.html">← <span id="back-label">Zurück</span></a>
  <div class="lang-toggle">
    <button class="lang-btn" id="lbtn-de" onclick="setLang('de')">🇩🇪 DE</button>
    <button class="lang-btn" id="lbtn-en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <div class="page-wrap">
    <h1>⚡ Auslastungsrate</h1>
    <div class="report-card">
      <div class="report-header">
        <div class="dot"></div>
        <span>Power BI Live-Report · ELMI Power</span>
      </div>
      <div class="iframe-loading" id="iframe-loading">
        <div class="spinner"></div>
        <span>Report wird geladen …</span>
      </div>
      <iframe
        id="pbi-frame"
        src="https://app.powerbi.com/view?r=eyJrIjoiMmRlODdmODUtYzZiNi00MGJjLWE3MGQtZThkNDhkZjQ0ZjI3IiwidCI6ImNjMGY0YTAwLTFiZWMtNGEzZS04NGVkLTNlODdiMjFhZjU2YSJ9"
        allowFullScreen
        style="display:none"
        onload="document.getElementById('iframe-loading').style.display='none'; this.style.display='block';"
        title="ELMI Power Auslastungsrate">
      </iframe>
    </div>
  </div>

  <footer id="footer-text">ELMI Power GmbH · Interne Nutzung</footer>

  <script src="js/db.js"></script>
  <script>
  (function(){
    const lang = ELMI_DB.getLang();
    ELMI_DB.applyLangButtons(lang);
    window.setLang = ELMI_DB.setLang;
    document.getElementById('back-label').textContent = lang === 'en' ? 'Back' : 'Zurück';
    document.getElementById('footer-text').textContent = lang === 'en' ? 'ELMI Power GmbH · Internal use only' : 'ELMI Power GmbH · Interne Nutzung';
  })();
  </script>
</body>
</html>
