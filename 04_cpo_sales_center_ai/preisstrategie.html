<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preisstrategie · CPO Sales Center AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Maven Pro', system-ui, sans-serif; background: #FAFAFB; color: #0E0E14; min-height: 100vh; padding: 72px 16px 64px; }
    .back-btn { position: fixed; top: 16px; left: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: #FFFFFF; border: 1px solid #D1D1D8; border-radius: 999px; color: #4A4A55; font: 600 13px/1 'Maven Pro', system-ui, sans-serif; text-decoration: none; transition: background .2s; z-index: 100; }
    .back-btn:hover { background: #E7E7EB; }
    .lang-toggle { position: fixed; top: 16px; right: 20px; display: flex; gap: 6px; z-index: 100; }
    .lang-btn { background: transparent; border: 1px solid #D1D1D8; border-radius: 6px; padding: 5px 11px; cursor: pointer; font: 600 12px/1.4 'Maven Pro', system-ui, sans-serif; color: #4A4A55; transition: all .15s; display: flex; align-items: center; gap: 4px; }
    .lang-btn:hover { color: #0E0E14; border-color: #9A9AA5; }
    .lang-btn.active { background: #E7E7EB; border-color: #9A9AA5; color: #0E0E14; font-weight: 800; }
    h1 { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #F39A3A, #E32028, #6D2A99); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; }
    .page-wrap { max-width: 960px; margin: 0 auto; }
    .notice { background: #FFFFFF; border: 1px solid #E7E7EB; border-radius: 12px; padding: 12px 18px; font-size: 13px; color: #6B6B76; margin-bottom: 16px; }
    .notice a { color: #9B59B6; }
    /* Belegungsrate input */
    .beleg-section { background: #FFFFFF; border: 1px solid #E7E7EB; border-radius: 14px; padding: 20px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .beleg-section label { font-size: 12px; font-weight: 700; color: #6B6B76; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
    .beleg-input-wrap { display: flex; align-items: center; gap: 10px; }
    input[type=range] { width: 220px; accent-color: #9B59B6; }
    .beleg-val { font-size: 22px; font-weight: 800; color: #9B59B6; min-width: 52px; }
    .beleg-hint { font-size: 12px; color: #9A9AA5; margin-left: auto; }
    /* Result cards */
    .cards-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; }
    @media(max-width:640px) { .cards-row { grid-template-columns: 1fr; } }
    .price-card { background: #FFFFFF; border: 1px solid #E7E7EB; border-radius: 14px; padding: 20px; position: relative; }
    .price-card-type { font-size: 11px; font-weight: 800; color: #9B59B6; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .price-final { font-size: 42px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .price-final.ac  { color: #C39BD3; }
    .price-final.dc  { color: #9B59B6; }
    .price-final.hpc { color: #6D2A99; }
    .price-unit { font-size: 14px; color: #6B6B76; }
    .breakdown { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; font-size: 12px; }
    .breakdown-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: #F4F4F6; border-radius: 8px; }
    .breakdown-label { color: #6B6B76; }
    .breakdown-val { font-weight: 700; }
    .clamp-badge { position: absolute; top: 14px; right: 14px; background: rgba(243,154,58,.15); border: 1px solid rgba(243,154,58,.3); border-radius: 6px; padding: 3px 8px; font-size: 10px; color: #F39A3A; font-weight: 700; }
    /* Params section */
    .params-section { background: #FFFFFF; border: 1px solid #E7E7EB; border-radius: 14px; padding: 20px 24px; margin-bottom: 20px; }
    .params-title { font-size: 13px; font-weight: 800; color: #9B59B6; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 14px; }
    .params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 600; color: #6B6B76; letter-spacing: .3px; text-transform: uppercase; }
    input[type=number] { background: #F4F4F6; border: 1px solid #E7E7EB; border-radius: 8px; color: #0E0E14; font: 400 14px 'Maven Pro', system-ui, sans-serif; padding: 8px 11px; width: 100%; }
    input[type=number]:focus { outline: none; border-color: #6D2A99; }
    .minmax-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 14px; }
    .minmax-group { display: flex; flex-direction: column; gap: 8px; }
    .minmax-label { font-size: 11px; font-weight: 800; color: #9B59B6; text-transform: uppercase; letter-spacing: .4px; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font: 700 13px 'Maven Pro', system-ui, sans-serif; transition: opacity .15s; }
    .btn-primary { background: linear-gradient(135deg, #6D2A99, #9B59B6); color: #fff; }
    .btn:hover { opacity: .85; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #E7E7EB; border: 1px solid #E7E7EB; border-radius: 10px; padding: 12px 20px; font-size: 13px; color: #0E0E14; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    footer { text-align: center; margin-top: 40px; font-size: 12px; color: #9A9AA5; }
  </style>
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <a class="back-btn" href="index.html">← <span id="back-label">Zurück</span></a>
  <div class="lang-toggle">
    <button class="lang-btn" id="lbtn-de" onclick="setLang('de')">🇩🇪 DE</button>
    <button class="lang-btn" id="lbtn-en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <div class="page-wrap">
    <h1>💡 Preisstrategie</h1>
    <div class="notice" id="data-notice" style="display:none"></div>

    <!-- Belegungsrate input -->
    <div class="beleg-section">
      <label>Aktuelle Belegungsrate (aus Power-BI)</label>
      <div class="beleg-input-wrap">
        <input type="range" id="beleg-slider" min="0" max="100" value="50" oninput="onBelegChange(this.value)">
        <span class="beleg-val"><span id="beleg-pct">50</span> %</span>
      </div>
      <div class="beleg-hint">Manuell aus Power-BI-Report ablesen &amp; einstellen</div>
    </div>

    <!-- Price result cards -->
    <div class="cards-row" id="cards-row"></div>

    <!-- Parameters (synced with settings) -->
    <div class="params-section">
      <div class="params-title">⚙️ Preisstrategie-Parameter (synchron mit Settings)</div>
      <div class="params-grid">
        <div class="field"><label>Auslastungsschwelle (%)</label><input type="number" id="ps-schwelle" step="1" min="0" max="100"></div>
        <div class="field"><label>Preisschritt pro 10 %-Punkte (%)</label><input type="number" id="ps-schritt" step="0.5" min="0"></div>
        <div class="field"><label>Gewicht Auslastung (0–1)</label><input type="number" id="ps-wAusl" step="0.05" min="0" max="1"></div>
        <div class="field"><label>Gewicht Wettbewerb (0–1)</label><input type="number" id="ps-wWett" step="0.05" min="0" max="1"></div>
      </div>
      <div class="minmax-grid">
        <div class="minmax-group">
          <div class="minmax-label">AC</div>
          <div class="field"><label>Min €/kWh</label><input type="number" id="ps-min-ac" step="0.01"></div>
          <div class="field"><label>Max €/kWh</label><input type="number" id="ps-max-ac" step="0.01"></div>
        </div>
        <div class="minmax-group">
          <div class="minmax-label">DC</div>
          <div class="field"><label>Min €/kWh</label><input type="number" id="ps-min-dc" step="0.01"></div>
          <div class="field"><label>Max €/kWh</label><input type="number" id="ps-max-dc" step="0.01"></div>
        </div>
        <div class="minmax-group">
          <div class="minmax-label">HPC</div>
          <div class="field"><label>Min €/kWh</label><input type="number" id="ps-min-hpc" step="0.01"></div>
          <div class="field"><label>Max €/kWh</label><input type="number" id="ps-max-hpc" step="0.01"></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveParams()">💾 Parameter speichern</button>
      </div>
    </div>
  </div>

  <footer id="footer-text">ELMI Power GmbH · Interne Nutzung</footer>
  <div class="toast" id="toast"></div>

  <script src="js/db.js"></script>
  <script>
  (function(){
    const lang = ELMI_DB.getLang();
    ELMI_DB.applyLangButtons(lang);
    window.setLang = ELMI_DB.setLang;
    document.getElementById('back-label').textContent = lang === 'en' ? 'Back' : 'Zurück';
    document.getElementById('footer-text').textContent = lang === 'en' ? 'ELMI Power GmbH · Internal use only' : 'ELMI Power GmbH · Interne Nutzung';

    // ── Auslastung aus IndexedDB laden und Slider vorbelegen ──
    async function loadUtilisationFromDB() {
      try {
        const data = await ELMI_DB.dbGet('settings', 'stationUtilisation');
        if (!data || !data.active) return;
        const station = data.active;

        // Slider mit HPC-Auslastung vorbelegen (Fallback: DC, dann AC)
        const util = station.hpc?.util ?? station.dc?.util ?? station.ac?.util ?? null;
        if (util !== null) {
          const slider = document.getElementById('beleg-slider');
          if (slider) {
            belegRate = Math.round(util);
            slider.value = belegRate;
            document.getElementById('beleg-pct').textContent = belegRate;
          }
        }

        // Statusbadge nach dem Slider einfügen
        let badge = document.getElementById('utilSourceBadge');
        if (!badge) {
          badge = document.createElement('div');
          badge.id = 'utilSourceBadge';
          badge.style.cssText = 'font-size:12px;color:#4CAF50;margin-top:8px;padding:6px 12px;background:rgba(76,175,80,.1);border-radius:6px;border:1px solid rgba(76,175,80,.3);flex-basis:100%';
          const belegSection = document.querySelector('.beleg-section');
          if (belegSection) belegSection.appendChild(badge);
        }

        const hpcUtil = station.hpc?.util != null ? station.hpc.util.toFixed(1) + ' %' : '–';
        const dcUtil  = station.dc?.util  != null ? station.dc.util.toFixed(1)  + ' %' : '–';
        const acUtil  = station.ac?.util  != null ? station.ac.util.toFixed(1)  + ' %' : '–';
        badge.innerHTML = `✓ Auto-Auslastung aus Excel: HPC ${hpcUtil} · DC ${dcUtil} · AC ${acUtil}
          <span style="color:#9A9AA5"> · ${data.fileName || ''}</span>
          <button onclick="clearUtilOverride()" style="margin-left:12px;background:none;border:1px solid #D1D1D8;color:#6B6B76;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer">Manuell überschreiben</button>`;
      } catch(e) { console.log('Keine Auslastungsdaten:', e); }
    }

    window.clearUtilOverride = function() {
      const badge = document.getElementById('utilSourceBadge');
      if (badge) badge.remove();
      const slider = document.getElementById('beleg-slider');
      if (slider) { belegRate = 50; slider.value = 50; document.getElementById('beleg-pct').textContent = 50; if (settings) recalc(); }
    };

    let settings = null;
    let wettData = null;
    let belegRate = 50;

    const TYPES = ['AC','DC','HPC'];

    async function init() {
      // Load settings first so fields render immediately
      settings = await ELMI_DB.loadSettings();
      fillParamFields(settings.preisstrategie);
      bindParamInputs();

      // Load wettbewerber data (may be large) in background
      wettData = await ELMI_DB.loadWettbewerberDaten();

      const { source } = wettData;
      if (source === 'none') {
        const n = document.getElementById('data-notice');
        n.style.display = 'block';
        n.textContent = '⚠ Wettbewerberdaten nicht verfügbar – Wettbewerbsfaktor wird als 0 berechnet.';
      }

      recalc();
      await loadUtilisationFromDB();
      if (settings) recalc();
    }

    function fillParamFields(ps) {
      document.getElementById('ps-schwelle').value = ps.auslastungSchwelle;
      document.getElementById('ps-schritt').value  = ps.auslastungSchritt;
      document.getElementById('ps-wAusl').value    = ps.auslastungsGewicht;
      document.getElementById('ps-wWett').value    = ps.wettbewerbsGewicht;
      document.getElementById('ps-min-ac').value   = ps.preisMin.AC;
      document.getElementById('ps-min-dc').value   = ps.preisMin.DC;
      document.getElementById('ps-min-hpc').value  = ps.preisMin.HPC;
      document.getElementById('ps-max-ac').value   = ps.preisMax.AC;
      document.getElementById('ps-max-dc').value   = ps.preisMax.DC;
      document.getElementById('ps-max-hpc').value  = ps.preisMax.HPC;
    }

    function readParamFields() {
      return {
        auslastungSchwelle:  parseFloat(document.getElementById('ps-schwelle').value) || 50,
        auslastungSchritt:   parseFloat(document.getElementById('ps-schritt').value)  || 5,
        auslastungsGewicht:  parseFloat(document.getElementById('ps-wAusl').value)    || 0.5,
        wettbewerbsGewicht:  parseFloat(document.getElementById('ps-wWett').value)    || 0.5,
        preisMin: {
          AC:  parseFloat(document.getElementById('ps-min-ac').value)  || 0,
          DC:  parseFloat(document.getElementById('ps-min-dc').value)  || 0,
          HPC: parseFloat(document.getElementById('ps-min-hpc').value) || 0
        },
        preisMax: {
          AC:  parseFloat(document.getElementById('ps-max-ac').value)  || 99,
          DC:  parseFloat(document.getElementById('ps-max-dc').value)  || 99,
          HPC: parseFloat(document.getElementById('ps-max-hpc').value) || 99
        }
      };
    }

    function recalc() {
      const ps     = readParamFields();
      const preise = settings.preise;

      // Wettbewerber-Mittelpreis je Ladetyp
      const overrides = []; // not needed here – already in joined
      const joined = ELMI_DB.joinWettbewerber(
        wettData.standorte, wettData.betreiber, overrides, settings
      );

      const wettMittel = {};
      TYPES.forEach(t => {
        const prices = joined.filter(s => s.ladetyp === t && s.preis_aktuell != null).map(s => s.preis_aktuell);
        wettMittel[t] = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : null;
      });

      // Auslastungsfaktor
      const schwelle = ps.auslastungSchwelle;
      const schritt  = ps.auslastungSchritt;
      const auslFaktor = belegRate <= schwelle ? 0 : ((belegRate - schwelle) / 10) * (schritt / 100);

      const cards = TYPES.map(t => {
        const P0  = preise[t] || 0;
        const wm  = wettMittel[t];
        const wettFaktor = wm != null ? (wm - P0) / (P0 || 1) : 0;
        const w1  = ps.auslastungsGewicht;
        const w2  = ps.wettbewerbsGewicht;
        const raw = P0 * (1 + w1 * auslFaktor + w2 * wettFaktor);
        const min = ps.preisMin[t];
        const max = ps.preisMax[t];
        const final = Math.min(max, Math.max(min, raw));
        const clampedMin = raw < min;
        const clampedMax = raw > max;
        const wettCount = joined.filter(s => s.ladetyp === t && s.preis_aktuell != null).length;
        return { t, P0, auslFaktor, wettFaktor, wm, wettCount, raw, final, min, max, clampedMin, clampedMax, w1, w2 };
      });

      renderCards(cards);
    }

    function renderCards(cards) {
      const row = document.getElementById('cards-row');
      row.innerHTML = cards.map(c => {
        const clampBadge = c.clampedMin
          ? `<div class="clamp-badge">Min ${c.min.toFixed(2)} €</div>`
          : c.clampedMax
          ? `<div class="clamp-badge">Max ${c.max.toFixed(2)} €</div>`
          : '';

        const fmt = n => n != null ? n.toFixed(4) : '–';
        const fmtPct = n => (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + ' %';
        const tl = c.t.toLowerCase();

        return `<div class="price-card">
          ${clampBadge}
          <div class="price-card-type">${c.t}</div>
          <div class="price-final ${tl}">${c.final.toFixed(3)}</div>
          <div class="price-unit">€/kWh</div>
          <div class="breakdown">
            <div class="breakdown-row">
              <span class="breakdown-label">Basispreis P₀</span>
              <span class="breakdown-val">${c.P0.toFixed(3)} €</span>
            </div>
            <div class="breakdown-row">
              <span class="breakdown-label">Auslastungsfaktor (${belegRate} %)</span>
              <span class="breakdown-val">${fmtPct(c.auslFaktor)} × ${c.w1}</span>
            </div>
            <div class="breakdown-row">
              <span class="breakdown-label">Wettbewerbsmittel${c.wm != null ? ' (' + c.wettCount + ' Betreiber)' : ''}</span>
              <span class="breakdown-val">${c.wm != null ? c.wm.toFixed(3) + ' €' : '–'}</span>
            </div>
            <div class="breakdown-row">
              <span class="breakdown-label">Wettbewerbsfaktor</span>
              <span class="breakdown-val">${fmtPct(c.wettFaktor)} × ${c.w2}</span>
            </div>
            <div class="breakdown-row">
              <span class="breakdown-label">Rohpreis (vor Clamp)</span>
              <span class="breakdown-val">${c.raw.toFixed(3)} €</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    window.onBelegChange = function(val) {
      belegRate = parseInt(val);
      document.getElementById('beleg-pct').textContent = belegRate;
      if (settings) recalc();
    };

    function bindParamInputs() {
      document.querySelectorAll('.params-section input[type=number]').forEach(el => {
        el.addEventListener('input', () => { if (settings && wettData) recalc(); });
      });
    }

    window.saveParams = async function() {
      settings.preisstrategie = readParamFields();
      await ELMI_DB.saveSettings(settings);
      showToast('✓ Parameter gespeichert');
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    init().catch(console.error);
  })();
  </script>
</body>
</html>
