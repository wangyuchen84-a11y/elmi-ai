<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ ELMI PV</title>
  <link rel="icon" type="image/png" href="/elmi-ai/assets/logo-elmi-gradient.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --elmi-orange:     #F39A3A;
      --elmi-tangerine:  #EC6A2A;
      --elmi-red:        #E32028;
      --elmi-magenta:    #B5188B;
      --elmi-purple:     #6D2A99;
      --elmi-gradient:   linear-gradient(90deg, #F39A3A 0%, #EC6A2A 22%, #E32028 48%, #B5188B 78%, #6D2A99 100%);
      --elmi-accent:     #E32028;

      --neutral-0:   #FFFFFF;
      --neutral-50:  #FAFAFB;
      --neutral-100: #F4F4F6;
      --neutral-200: #E7E7EB;
      --neutral-300: #D1D1D8;
      --neutral-400: #9A9AA5;
      --neutral-500: #6B6B76;
      --neutral-600: #4A4A55;
      --neutral-700: #2E2E36;
      --neutral-800: #1B1B22;
      --neutral-900: #0E0E14;

      --fg1: var(--neutral-900);
      --fg2: var(--neutral-600);
      --fg3: var(--neutral-400);
      --bg1: var(--neutral-0);
      --bg2: var(--neutral-50);
      --bg3: var(--neutral-100);
      --border-1: var(--neutral-200);
      --border-2: var(--neutral-300);

      --font-body: "Maven Pro", system-ui, sans-serif;

      --radius-sm:   8px;
      --radius-md:   14px;
      --radius-lg:   22px;
      --radius-pill: 999px;

      --shadow-1: 0 1px 2px rgba(14,14,20,.06);
      --shadow-2: 0 4px 12px rgba(14,14,20,.08);

      --ease-out: cubic-bezier(.22,1,.36,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg2);
      color: var(--fg1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .appbar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-1);
    }
    .appbar-top {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 28px;
      max-width: 1320px;
      margin: 0 auto;
    }
    .appbar-meta .title { font-size: 14px; font-weight: 700; color: var(--fg1); }
    .appbar-meta .sub { font-size: 12px; color: var(--fg2); }
    .gbar { height: 3px; background: var(--elmi-gradient); }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--elmi-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--neutral-100);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-pill);
      color: var(--fg2);
      font: 13px/1 var(--font-body);
      font-weight: 600;
      text-decoration: none;
      transition: background .2s, color .2s;
    }
    .back-btn:hover { background: var(--neutral-200); color: var(--fg1); }

    .lang-toggle { display:flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--border-1); border-radius:var(--radius-pill); background:#fff; }
    .lang-btn { background:transparent; border:0; border-radius:var(--radius-pill); padding:6px 13px; cursor:pointer; font:700 12px/1 var(--font-body); color:var(--fg2); letter-spacing:.04em; transition:background .14s,color .14s; }
    .lang-btn:hover { color:var(--fg1); }
    .lang-btn.active { background:var(--neutral-900); color:#fff; }
    .logo { display:none !important; }
    .ab-brand { display:flex; align-items:center; gap:11px; text-decoration:none; }
    .brand-logo { height:26px; display:block; }
    .brand-div { width:1px; height:22px; background:var(--border-1); display:block; }
    .brand-ai { font-family:var(--font-body); font-weight:800; font-size:18px; letter-spacing:.02em; color:var(--fg1); }

    .content {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      flex: 1;
    }

    .placeholder {
      background: var(--neutral-0);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      text-align: center;
      max-width: 520px;
      box-shadow: var(--shadow-2);
      margin: 60px auto;
    }
    .placeholder-icon { font-size: 40px; margin-bottom: 16px; }
    .placeholder-title { font-size: 20px; font-weight: 800; color: var(--fg1); margin-bottom: 10px; }
    .placeholder-text { font-size: 14px; color: var(--fg2); line-height: 1.6; }
    .placeholder-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 6px 14px;
      background: var(--neutral-100);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--fg2);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    footer { margin-top: 64px; font-size: 12px; color: var(--fg3); text-align: center; }
  </style>
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

  <header class="appbar">
    <div class="appbar-top">
      <a class="ab-brand" href="../"><img class="brand-logo" src="../assets/logo-elmi-gradient.png" alt="ELMI"><span class="brand-div"></span><span class="brand-ai">AI</span></a><div class="logo">☀️</div>
      <div class="appbar-meta">
        <div class="title">PV Optimization AI</div>
        <div class="sub" id="subtitle-text">KI-gestützte Optimierung von PV-Anlagen</div>
      </div>
      <div style="flex:1"></div>
      <a class="back-btn" id="back-btn" href="../">← <span id="back-label">Zurück</span></a>
      <div class="lang-toggle">
        <button class="lang-btn" id="lbtn-de" onclick="setLang('de')">DE</button>
        <button class="lang-btn" id="lbtn-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
    <div class="gbar"></div>
  </header>

  <div class="content">
    <div class="placeholder">
      <div class="placeholder-icon">⚡</div>
      <div class="placeholder-title" id="placeholder-title">PV Optimization AI</div>
      <p class="placeholder-text" id="placeholder-text">Dieses Modul wird gerade aufgebaut.</p>
      <div class="placeholder-badge" id="placeholder-badge">Coming Soon</div>
    </div>

    <footer id="footer-text">ELMI Power GmbH · Interne Nutzung</footer>
  </div>

  <script>
  (function(){
    var STRINGS = {
      de: {
        back: 'Zurück',
        subtitle: 'KI-gestützte Optimierung von PV-Anlagen',
        title: 'PV Optimization AI',
        placeholder: 'Dieses Modul wird gerade aufgebaut.',
        badge: 'Coming Soon',
        footer: 'ELMI Power GmbH · Interne Nutzung'
      },
      en: {
        back: 'Back',
        subtitle: 'AI-driven optimisation of PV systems',
        title: 'PV Optimization AI',
        placeholder: 'This module is currently under construction.',
        badge: 'Coming Soon',
        footer: 'ELMI Power GmbH · Internal use only'
      }
    };

    function applyLang(lang) {
      var s = STRINGS[lang] || STRINGS.de;
      document.getElementById('back-label').textContent       = s.back;
      document.getElementById('subtitle-text').textContent    = s.subtitle;
      document.getElementById('placeholder-title').textContent = s.title;
      document.getElementById('placeholder-text').textContent = s.placeholder;
      document.getElementById('placeholder-badge').textContent = s.badge;
      document.getElementById('footer-text').textContent      = s.footer;
      document.documentElement.lang = lang;
      ['de','en'].forEach(function(l){
        var b = document.getElementById('lbtn-'+l);
        if (b) b.classList.toggle('active', l === lang);
      });
    }

    window.setLang = function(lang) {
      localStorage.setItem('elmi_lang', lang);
      applyLang(lang);
    };

    applyLang(localStorage.getItem('elmi_lang') || 'de');
  })();
  </script>
</body>
</html>
