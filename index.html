<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELMI AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Maven Pro', system-ui, sans-serif;
      background: #0E0E14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #F39A3A, #E32028, #6D2A99);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #F39A3A, #E32028, #6D2A99);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #6B6B76;
      margin-bottom: 48px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .card {
      display: block;
      background: #1B1B22;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, background .2s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(243,154,58,.07), rgba(227,32,40,.07), rgba(109,42,153,.07));
      opacity: 0;
      transition: opacity .2s;
    }

    .card:hover { border-color: rgba(227,32,40,.4); }
    .card:hover::before { opacity: 1; }

    .card-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 13px;
      color: #6B6B76;
      line-height: 1.5;
    }

    .card-arrow {
      position: absolute;
      top: 24px;
      right: 24px;
      color: rgba(255,255,255,.2);
      font-size: 18px;
      transition: color .2s, transform .2s;
    }

    .card:hover .card-arrow {
      color: #E32028;
      transform: translateX(2px);
    }

    footer {
      margin-top: 64px;
      font-size: 12px;
      color: #3A3A3C;
    }
  </style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>ELMI AI</h1>
  <p class="subtitle">Interne Tools &amp; Dashboards</p>

  <div class="grid">
    <a class="card" href="01_operating_performance/">
      <div class="card-icon">📊</div>
      <div class="card-title">Operating Performance</div>
      <div class="card-desc">CPO Sites Dashboard – Betriebskennzahlen</div>
      <span class="card-arrow">→</span>
    </a>
  </div>

  <footer>ELMI Power GmbH · Interne Nutzung</footer>
</body>
</html>
