      var j = await r.json();
      var arr = Array.isArray(j) ? j : ((j && j.devices) || []);
      var devs = arr.map(function(d){ return (typeof d === 'string') ? { sn: d, label: d } : { sn: d.sn, label: d.label || d.sn }; })
                    .filter(function(d){ return d.sn; });
      if (devs.length) return devs;
    }
  }catch(e){}
  try{
    var r2 = await fetch('data/manifest.json?t=' + Date.now(), { cache: 'no-store' });
    if (r2.ok){
      var names = await r2.json();
      var devs2 = (names || []).map(function(n){ var sn = String(n).replace(/\.(xlsx|xls)$/i, ''); return { sn: sn, label: sn }; })
                               .filter(function(d){ return d.sn; });
      if (devs2.length) return devs2;
    }
  }catch(e){}
  return API_CONFIG.devices.slice();
}

/* Effektive Liste = Basis + selbst hinzugefuegte SNs, dedupliziert nach SN. */
async function loadDeviceList(){
  var base = await loadBaseDeviceList();
  var seen = {}, out = [];
  base.concat(getUserDevices()).forEach(function(dv){
    var o = (typeof dv === 'string') ? { sn: dv, label: dv } : { sn: dv.sn, label: dv.label || dv.sn };
    if (o.sn && !seen[o.sn]){ seen[o.sn] = 1; out.push(o); }
  });
  return out;
}

function buildLiveSection(){
  ensureStyles();
  var status = el('div', { id: 'elmi-live-status', class: 'elmi-live-status hidden' });

  /* Geraeteauswahl: Dropdown + „Geraeteliste aktualisieren"-Button */
  var devSelect = el('select', { id: 'elmi-dev-select', style: { minWidth: '260px' } });
  var devUpdateBtn = el('button', { class: 'elmi-chip-btn', type: 'button' }, '🔄 Geraeteliste aktualisieren');
  var devHint = el('div', { class: 'elmi-utc-hint', id: 'elmi-dev-hint' });
  function fillDevSelect(devices){
    var want = _selectedSn || devSelect.value;
    devSelect.innerHTML = '';
    devices.forEach(function(dv){ devSelect.appendChild(el('option', { value: dv.sn }, dv.label || dv.sn)); });
    if (want && devices.some(function(d){ return d.sn === want; })) devSelect.value = want;
    _selectedSn = devSelect.value;
    _deviceCache = devices;
  }
  devSelect.addEventListener('change', function(){ _selectedSn = devSelect.value; });
  async function refreshDevices(){
    var orig = devUpdateBtn.textContent; devUpdateBtn.disabled = true; devUpdateBtn.textContent = '⏳ …';
    try{
      var devices = await loadDeviceList();
      fillDevSelect(devices);
      renderDevManageList(document.getElementById('elmi-devmanage-list'));
      devHint.textContent = devices.length + ' Geraet(e) verfuegbar.';
    }catch(e){
      fillDevSelect(API_CONFIG.devices);
      devHint.textContent = 'Standardliste — Aktualisierung fehlgeschlagen.';
    }finally{ devUpdateBtn.disabled = false; devUpdateBtn.textContent = orig; }
  }
  devUpdateBtn.addEventListener('click', refreshDevices);
  if (_deviceCache && _deviceCache.length){ fillDevSelect(_deviceCache); devHint.textContent = _deviceCache.length + ' Geraet(e) verfuegbar.'; }
  else { fillDevSelect(API_CONFIG.devices); refreshDevices(); }

  /* Zeitraum */
  var today = zonedToday(activeTz());
  var toStr = today.y + '-' + pad(today.m) + '-' + pad(today.d);
  var fromInit = new Date(Date.UTC(today.y, today.m - 1, today.d));
  fromInit.setUTCDate(fromInit.getUTCDate() - 6);
  var fromStr = fromInit.getUTCFullYear() + '-' + pad(fromInit.getUTCMonth() + 1) + '-' + pad(fromInit.getUTCDate());
  var fromInput = el('input', { type: 'date', id: 'elmi-live-from', value: fromStr });
  var toInput   = el('input', { type: 'date', id: 'elmi-live-to',   value: toStr });
  var utcHint   = el('div', { class: 'elmi-utc-hint', id: 'elmi-utc-hint' });

  function setRange(fY, fM, fD, tY, tM, tD){
    fromInput.value = fY + '-' + pad(fM) + '-' + pad(fD);
    toInput.value   = tY + '-' + pad(tM) + '-' + pad(tD);
    updateUtcHint();
  }
  function quick(kind){
    var tz = activeTz(), td = zonedToday(tz);
    var base = new Date(Date.UTC(td.y, td.m - 1, td.d));
    if (kind === '7'){ var f = new Date(base); f.setUTCDate(f.getUTCDate() - 6); setRange(f.getUTCFullYear(), f.getUTCMonth()+1, f.getUTCDate(), td.y, td.m, td.d); }
    else if (kind === '30'){ var f2 = new Date(base); f2.setUTCDate(f2.getUTCDate() - 29); setRange(f2.getUTCFullYear(), f2.getUTCMonth()+1, f2.getUTCDate(), td.y, td.m, td.d); }
    else if (kind === 'cur'){ setRange(td.y, td.m, 1, td.y, td.m, td.d); }
    else if (kind === 'last'){
      var lm = td.m === 1 ? 12 : td.m - 1, ly = td.m === 1 ? td.y - 1 : td.y;
      var lastDay = new Date(Date.UTC(ly, lm, 0)).getUTCDate();
      setRange(ly, lm, 1, ly, lm, lastDay);
    }
  }
  var quickBar = el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px' } },
    el('button', { class: 'elmi-chip-btn', type: 'button' }, 'Letzte 7 Tage'),
    el('button', { class: 'elmi-chip-btn', type: 'button' }, 'Letzte 30 Tage'),
    el('button', { class: 'elmi-chip-btn', type: 'button' }, 'Laufender Monat'),
    el('button', { class: 'elmi-chip-btn', type: 'button' }, 'Letzter Monat'));
  var qk = ['7', '30', 'cur', 'last'];
  Array.prototype.slice.call(quickBar.children).forEach(function(b, i){ b.addEventListener('click', function(){ quick(qk[i]); }); });

  function parseDateStr(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
  function updateUtcHint(){
    var tz = activeTz();
    var f = parseDateStr(fromInput.value), t = parseDateStr(toInput.value);
    if (!f || !t){ utcHint.textContent = ''; return; }
    var fromUtc = zonedToUtc(f.y, f.m, f.d, 0, 0, tz);
    var toEx = new Date(Date.UTC(t.y, t.m - 1, t.d)); toEx.setUTCDate(toEx.getUTCDate() + 1);
    var toUtc = zonedToUtc(toEx.getUTCFullYear(), toEx.getUTCMonth() + 1, toEx.getUTCDate(), 0, 0, tz);
    utcHint.textContent = 'Abgefragter UTC-Bereich: ' + isoUtcTrim(fromUtc) + '  bis  ' + isoUtcTrim(toUtc)
      + '   (Eingabe als ' + tzShort(tz) + ' interpretiert)';
  }
  fromInput.addEventListener('change', updateUtcHint);
  toInput.addEventListener('change', updateUtcHint);
  setTimeout(updateUtcHint, 0);

  /* Key-Feld (nur wenn kein Key gesetzt) + Zuruecksetzen-Link */
  var keyInput = el('input', { type: 'password', id: 'elmi-live-key', placeholder: 'Dashboard-Key', autocomplete: 'off', style: { width: '260px' } });
  var keyField = labeledField('Dashboard-Key (einmalig)', keyInput);
  var resetLink = el('button', { class: 'elmi-ghost-link', type: 'button' }, 'Key zuruecksetzen');
  var keyRow = el('div', { id: 'elmi-key-row', style: { display: 'flex', gap: '10px', alignItems: 'flex-end', marginTop: '4px' } }, keyField);
  var resetRow = el('div', { id: 'elmi-key-reset', style: { marginTop: '4px' } }, resetLink);
  function refreshKeyUi(){
    if (keyIsSet()){ keyRow.style.display = 'none'; resetRow.style.display = 'block'; }
    else { keyRow.style.display = 'flex'; resetRow.style.display = 'none'; }
  }
  resetLink.addEventListener('click', function(){ sessionStorage.removeItem(KEY_SS); refreshKeyUi(); showStatus(status, 'ℹ️ Key entfernt. Bitte neu eingeben.', 'info'); });
  refreshKeyUi();

  /* In-Session-Geraeteumschalter (nach Abruf sichtbar) */
  var switchWrap = el('div', { id: 'elmi-live-switch', style: { display: 'none', marginTop: '10px' } });

  /* Abruf-Button + Abbrechen */
  var btn = el('button', { id: 'elmi-live-btn', class: 'elmi-live-btn', type: 'button' }, '📡 Daten abrufen');
  var cancelBtn = el('button', { class: 'elmi-chip-btn', type: 'button', style: { display: 'none' } }, 'Abbrechen');
  cancelBtn.addEventListener('click', function(){ if (_abort) _abort.abort(); });

  btn.addEventListener('click', function(){ runFetch(devSelect, fromInput, toInput, keyInput, status, btn, cancelBtn, switchWrap, refreshKeyUi); });

  /* Zustand nach Neu-Injektion (Recompute rebaut den Settings-Tab) wiederherstellen */
  if (_lastStatus) showStatus(status, _lastStatus.msg, _lastStatus.type);
  var _fetched = Object.keys(_fetchedDbs);
  if (_fetched.length >= 2) buildDeviceSwitcher(switchWrap, _fetched, status);

  return el('div', { id: 'elmi-live-section' },
    el('div', { class: 'section-title', style: { marginTop: '0' } }, '🔌 Live-Daten abrufen'),
    el('div', { class: 'settings-hint' }, 'Ruft Telemetrie direkt ueber den gesicherten ELMI-Worker ab — kein Excel-Export noetig. Daten landen im selben Speicher wie hochgeladene Dateien.'),
    el('div', { class: 'input-hint', style: { marginTop: '12px' } }, 'Geraet'),
    el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', marginTop: '6px' } }, devSelect, devUpdateBtn),
    devHint,
    el('div', { class: 'input-hint', style: { marginTop: '12px' } }, 'Zeitraum'),
    el('div', { style: { display: 'flex', gap: '10px', alignItems: 'flex-end', flexWrap: 'wrap' } },
      labeledField('Von', fromInput), labeledField('Bis', toInput)),
    quickBar, utcHint,
    keyRow, resetRow,
    el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', marginTop: '14px' } }, btn, cancelBtn),
    switchWrap,
    status);
}

async function runFetch(devSelect, fromInput, toInput, keyInput, status, btn, cancelBtn, switchWrap, refreshKeyUi){
  var tz = activeTz();
  var sns = devSelect.value ? [devSelect.value] : [];
  if (!sns.length){ showStatus(status, '⚠️ Bitte ein Geraet auswaehlen (ggf. erst „Geraeteliste aktualisieren").', 'warn'); return; }
  _selectedSn = sns[0];
  var f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(fromInput.value), t = /^(\d{4})-(\d{2})-(\d{2})$/.exec(toInput.value);
  if (!f || !t){ showStatus(status, '⚠️ Bitte Von- und Bis-Datum waehlen.', 'warn'); return; }
  var fromUtc = zonedToUtc(+f[1], +f[2], +f[3], 0, 0, tz);
  var toEx = new Date(Date.UTC(+t[1], +t[2] - 1, +t[3])); toEx.setUTCDate(toEx.getUTCDate() + 1);
  var toUtc = zonedToUtc(toEx.getUTCFullYear(), toEx.getUTCMonth() + 1, toEx.getUTCDate(), 0, 0, tz);
  if (toUtc <= fromUtc){ showStatus(status, '⚠️ Bis-Datum muss nach dem Von-Datum liegen.', 'warn'); return; }
  var rangeDays = (toUtc - fromUtc) / 86400000;
  if (rangeDays > API_CONFIG.maxRangeDays){ showStatus(status, '⚠️ Zeitraum zu lang (max. ' + API_CONFIG.maxRangeDays + ' Tage).', 'warn'); return; }

  /* Key ggf. aus Eingabefeld uebernehmen */
  if (!keyIsSet()){
    var kv = (keyInput.value || '').trim();
    if (!kv){ showStatus(status, '⚠️ Bitte den Dashboard-Key eingeben.', 'warn'); return; }
    sessionStorage.setItem(KEY_SS, kv);
    keyInput.value = '';
    refreshKeyUi();
  }

  _abort = new AbortController();
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Laedt…'; cancelBtn.style.display = 'inline-block';
  var onProgress = function(msg){ showStatus(status, '⏳ ' + msg, 'info'); };
  try{
    var out = await fetchDeviceAnalysis({ sns: sns, from: fromUtc, to: toUtc, onProgress: onProgress, signal: _abort.signal });
    /* nach SN gruppieren */
    var bySn = {}; sns.forEach(function(s){ bySn[s] = []; });
    out.rows.forEach(function(r){ (bySn[r.sn] || (bySn[r.sn] = [])).push(r); });
    var stationDbs = {}, totalRows = 0, withData = [];
    Object.keys(bySn).forEach(function(sn){
      var rows = apiRowsToRows(bySn[sn]);
      if (!rows.length) return;
      stationDbs[sn] = buildDB(sn, rows);
      _fetchedDbs[sn] = stationDbs[sn];
      totalRows += rows.length; withData.push(sn);
    });
    if (!withData.length){ showStatus(status, '⚠️ Keine Datenpunkte im gewaehlten Zeitraum.', 'warn'); return; }

    await persistApiStations(stationDbs);

    /* erstes Geraet anzeigen */
    var firstSn = withData[0];
    window.ELMI.app.applyDB(stationDbs[firstSn], null);
    window.ELMI.app._dataSource = 'Live API · ' + firstSn + ' · ' + fmtStamp(new Date());
    window.ELMI.app.render();
    updateZoneBadges();

    buildDeviceSwitcher(switchWrap, withData, status);

    var msg = '✅ ' + totalRows.toLocaleString('de') + ' Datensaetze fuer ' + withData.length + ' Geraet(e) geladen.\n'
      + 'Zeitraum ' + isoUtcTrim(fromUtc) + ' bis ' + isoUtcTrim(toUtc) + ' (UTC).';
    if (out.errors && out.errors.length){
      var wins = out.errors.map(function(e){ return e.sn + ' ' + e.from + '…' + e.to; }).join('\n  ');
      showStatus(status, '⚠️ Teilweise geladen — folgende Zeitfenster fehlen:\n  ' + wins + '\n\n' + msg, 'warn');
    } else {
      showStatus(status, msg + (withData.length > 1 ? '\nGeraet unten umschaltbar.' : ''), 'ok');
    }
  }catch(err){
    if (err.name === 'AbortError'){ showStatus(status, 'ℹ️ Abruf abgebrochen.', 'info'); }
    else if (err.code === 401){ refreshKeyUi(); showStatus(status, '❌ ' + err.message + ' — bitte Key erneut eingeben.', 'error'); }
    else if (err.code === 403){ showStatus(status, '❌ ' + err.message + ' (403). Das kann nur das Backend-Team freischalten.', 'error'); }
    else if (err.code === 'NOKEY'){ refreshKeyUi(); showStatus(status, '⚠️ Bitte den Dashboard-Key eingeben.', 'warn'); }
    else { showStatus(status, '❌ ' + (err.message || err), 'error'); }
  }finally{
    _abort = null;
    btn.disabled = false; btn.textContent = orig; cancelBtn.style.display = 'none';
  }
}

function buildDeviceSwitcher(wrap, sns, status){
  wrap.innerHTML = '';
  if (sns.length < 2){ wrap.style.display = 'none'; return; }
  var sel = el('select', { id: 'elmi-live-active' });
  sns.forEach(function(sn){ sel.appendChild(el('option', { value: sn }, sn)); });
  sel.addEventListener('change', function(){
    var db = _fetchedDbs[sel.value];
    if (!db) return;
    window.ELMI.app.applyDB(db, null);
    window.ELMI.app._dataSource = 'Live API · ' + sel.value + ' · ' + fmtStamp(new Date());
    window.ELMI.app.render();
    updateZoneBadges();
  });
  wrap.appendChild(labeledField('Angezeigtes Geraet', sel));
  wrap.style.display = 'block';
}

/* ================= UI: Settings-Zeitzone ========================== */
function buildTzSection(){
  ensureStyles();
  var sel = el('select', { id: 'elmi-tz-select' });
  var cur = activeTz();
  API_CONFIG.timezones.forEach(function(z){
    var o = el('option', { value: z.id }, z.label);
    if (z.id === cur) o.selected = true;
    sel.appendChild(o);
  });
  var badge = el('span', { class: 'elmi-zone-badge', id: 'elmi-tz-active' }, tzShort(cur));
  sel.addEventListener('change', function(){
    localStorage.setItem(TZ_LS, sel.value);
    document.dispatchEvent(new CustomEvent('elmi:timezone-changed', { detail: { tz: sel.value } }));
  });
  return el('div', { id: 'elmi-tz-section' },
    el('div', { class: 'section-title', style: { marginTop: '0' } }, '🕒 Anzeigezeitzone ', badge),
    el('div', { class: 'settings-hint' }, 'Alle Zeiten sind intern UTC. Die Auswahl rechnet Charts, Achsen, Tooltips und tageweise Summen sofort in die gewaehlte Zone um — ohne Neu-Abruf.'),
    el('div', { style: { marginTop: '10px' } }, labeledField('Zone', sel)));
}
function updateZoneBadges(){
  var b = document.getElementById('elmi-tz-active');
  if (b) b.textContent = tzShort(activeTz());
}

/* ================= UI: Settings-Geraeteverwaltung ================= */
function buildDevManageSection(){
  ensureStyles();
  var listWrap = el('div', { id: 'elmi-devmanage-list', class: 'elmi-devnames-list' });
  var hint = el('div', { class: 'elmi-utc-hint', id: 'elmi-devmanage-hint' });
  var snInput = el('input', { type: 'text', id: 'elmi-add-sn', placeholder: 'z. B. A131120000009999999999', style: { flex: '1', minWidth: '200px' } });
  var addBtn = el('button', { class: 'elmi-live-btn', type: 'button' }, '➕ Hinzufuegen');
  function doAdd(){
    var sn = normalizeSn(snInput.value);
    if (!sn){ hint.textContent = 'Bitte eine Seriennummer eingeben.'; return; }
    if ((_deviceCache || []).some(function(d){ return d.sn === sn; })){ hint.textContent = 'Diese Seriennummer ist bereits in der Liste.'; return; }
    addUserDevice(sn);
    snInput.value = '';
    _selectedSn = sn;
    reloadDevicesEverywhere().then(function(){ hint.textContent = '✓ Hinzugefuegt: ' + sn; });
  }
  addBtn.addEventListener('click', doAdd);
  snInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  renderDevManageList(listWrap);
  return el('div', { id: 'elmi-devmanage-section' },
    el('div', { class: 'section-title', style: { marginTop: '0' } }, '🔧 Geraete verwalten'),
    el('div', { class: 'settings-hint' }, 'Eigene Seriennummern hinzufuegen. Sie erscheinen sofort im Dropdown. Wird nur in diesem Browser gespeichert; fuer alle Nutzer sichtbare Geraete gehoeren in devices.json.'),
    el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', marginTop: '10px' } }, snInput, addBtn),
    hint,
    el('div', { class: 'input-hint', style: { marginTop: '12px' } }, 'Aktuelle Geraete'),
    listWrap);
}

/* ================= Injektion in den Settings-/Input-Tab =========== */
function injectSections(page){
  if (!page) return;
  ensureStyles();
  if (!page.querySelector('#elmi-live-section')){
    var live = buildLiveSection();
    var anchor = page.querySelector('#elmi-folder-section') || page.querySelector('.ds-card');
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(live, anchor.nextSibling);
    else page.appendChild(live);
  }
  if (!page.querySelector('#elmi-tz-section')){
    var tz = buildTzSection();
    var liveEl = page.querySelector('#elmi-live-section');
    if (liveEl && liveEl.parentNode) liveEl.parentNode.insertBefore(tz, liveEl.nextSibling);
    else page.appendChild(tz);
  }
  if (!page.querySelector('#elmi-devmanage-section')){
    var dn = buildDevManageSection();
    var tzEl = page.querySelector('#elmi-tz-section');
    if (tzEl && tzEl.parentNode) tzEl.parentNode.insertBefore(dn, tzEl.nextSibling);
    else page.appendChild(dn);
  }
}
function tryInject(){
  if (location.hash !== '#input' && location.hash !== '') return;
  var page = document.querySelector('#content .page');
  if (page) injectSections(page);
}

/* Zone-Wechsel: alle Ansichten neu rendern (ohne Reload/Abruf) */
document.addEventListener('elmi:timezone-changed', reapplyZone);

/* applyDB-Patch installieren, sobald der Kern bereit ist */
var _pi = 0, _piv = setInterval(function(){
  _pi++;
  if (installApplyPatch()){
    clearInterval(_piv);
    /* ggf. bereits gerendertes Dataset einmal in aktiver Zone nachziehen */
    setTimeout(function(){ if (_canonicalDb) reapplyZone(); }, 600);
  } else if (_pi > 80){ clearInterval(_piv); }
}, 150);

/* Settings-Tab beobachten (DOM wird bei jedem Recompute neu gebaut) */
function startWatching(){
  var contentEl = document.getElementById('content');
  if (!contentEl) return false;
  new MutationObserver(function(){ tryInject(); }).observe(contentEl, { childList: true, subtree: true });
  window.addEventListener('hashchange', tryInject);
  tryInject();
  return true;
}
var _lsi = 0, _lsiv = setInterval(function(){ _lsi++; if (startWatching() || _lsi > 80) clearInterval(_lsiv); }, 200);

})();
