:root{
  --elmi-orange:#F39A3A; --elmi-tangerine:#EC6A2A; --elmi-red:#E32028; --elmi-magenta:#B5188B; --elmi-purple:#6D2A99;
  --elmi-gradient:linear-gradient(90deg,#F39A3A 0%,#EC6A2A 22%,#E32028 48%,#B5188B 78%,#6D2A99 100%);
  --elmi-gradient-v:linear-gradient(180deg,#F39A3A 0%,#E32028 50%,#6D2A99 100%);
  --elmi-accent:#E32028;
  --neutral-0:#FFFFFF; --neutral-50:#FAFAFB; --neutral-100:#F4F4F6; --neutral-200:#E7E7EB;
  --neutral-300:#D1D1D8; --neutral-400:#9A9AA5; --neutral-500:#6B6B76; --neutral-600:#4A4A55;
  --neutral-700:#2E2E36; --neutral-800:#1B1B22; --neutral-900:#0E0E14;
  --fg1:var(--neutral-900); --fg2:var(--neutral-600); --fg3:var(--neutral-400);
  --bg1:var(--neutral-0); --bg2:var(--neutral-50); --bg3:var(--neutral-100);
  --bg-dark:var(--neutral-900); --bg-dark-elev:#16161E;
  --border-1:var(--neutral-200); --border-2:var(--neutral-300);
  --success:#1F9D55; --warning:#E2A100; --danger:var(--elmi-red); --info:#2563EB;
  --font-display:"Maven Pro",system-ui,sans-serif; --font-body:"Maven Pro",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius-sm:8px; --radius-md:14px; --radius-lg:22px; --radius-xl:32px; --radius-pill:999px;
  --shadow-1:0 1px 2px rgba(14,14,20,.06); --shadow-2:0 4px 12px rgba(14,14,20,.08);
  --shadow-3:0 12px 32px rgba(14,14,20,.10); --shadow-4:0 24px 60px rgba(14,14,20,.16);
  --shadow-glow:0 12px 28px rgba(227,32,40,.22),0 4px 10px rgba(109,42,153,.18);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --c1:#E32028; --c2:#6D2A99; --c3:#EC6A2A; --c4:#2563EB; --c5:#1F9D55; --c6:#B5188B; --c7:#E2A100;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body); color:var(--fg1); background:var(--bg2);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:-.01em; margin:0; line-height:1.12;}
.mono{font-family:var(--font-mono);}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--elmi-red);}
.gradtext{background:var(--elmi-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;}

/* ---------- App shell ---------- */
.appbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-1);
}
.appbar-top{display:flex; align-items:center; gap:18px; padding:12px 28px;}
.appbar-top img.logo{height:30px;}
.appbar-meta{display:flex; flex-direction:column; line-height:1.2;}
.appbar-meta .title{font-size:14px; font-weight:700; color:var(--fg1);}
.appbar-meta .sub{font-size:12px; color:var(--fg2);}
.appbar-top .spacer{flex:1;}
.station-chip{
  font-size:12px; font-weight:600; color:var(--fg1); background:var(--neutral-100);
  border-radius:var(--radius-pill); padding:7px 14px; display:inline-flex; gap:8px; align-items:center;
}
.station-chip .dot{width:7px; height:7px; border-radius:999px; background:var(--success);}
.gbar{height:3px; background:var(--elmi-gradient);}

/* tabs */
.tabs{display:flex; gap:2px; padding:0 22px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--fg2);
  padding:13px 14px 12px; white-space:nowrap; position:relative; display:flex; align-items:center; gap:8px;
  transition:color var(--ease-out) 160ms;
}
.tab .num{
  font-size:10px; font-weight:700; color:var(--fg3); font-family:var(--font-mono);
  background:var(--neutral-100); border-radius:5px; padding:2px 5px; line-height:1;
}
.tab:hover{color:var(--fg1);}
.tab.active{color:var(--elmi-red);}
.tab.active .num{background:rgba(227,32,40,.12); color:var(--elmi-red);}
.tab.active::after{content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--elmi-gradient);}
.tab.tab-input.active::after{background:var(--neutral-900);}
.tab.tab-input.active{color:var(--neutral-900);}

/* ---------- Layout ---------- */
.page{max-width:1320px; margin:0 auto; padding:32px 28px 80px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px;}
.page-head .ph-l{display:flex; flex-direction:column; gap:6px;}
.page-head h1{font-size:32px; font-weight:800;}
.page-head .lead{font-size:15px; color:var(--fg2); max-width:680px;}
.page-head .stepnav{display:flex; gap:8px; flex-shrink:0;}

.section-title{display:flex; align-items:center; gap:10px; margin:34px 0 14px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg2);}
.section-title::before{content:""; width:14px; height:3px; border-radius:2px; background:var(--elmi-gradient);}
.section-title:first-of-type{margin-top:6px;}

.grid{display:grid; gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);} .g5{grid-template-columns:repeat(5,1fr);} .g6{grid-template-columns:repeat(6,1fr);}
@media(max-width:1100px){.g4,.g5,.g6{grid-template-columns:repeat(3,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}

/* card */
.card{background:var(--neutral-0); border:1px solid var(--border-1); border-radius:var(--radius-md); box-shadow:var(--shadow-1);}
.card-pad{padding:22px 22px;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px 0;}
.card-head h3{font-size:17px; font-weight:700;}
.card-head .ch-sub{font-size:12px; color:var(--fg2);}

/* KPI tile */
.kpi{background:var(--neutral-0); border:1px solid var(--border-1); border-radius:var(--radius-md); padding:16px 18px; display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow-1); transition:box-shadow var(--ease-out) 200ms, transform var(--ease-out) 200ms;}
.kpi:hover{box-shadow:var(--shadow-3); transform:translateY(-2px);}
.kpi .eb{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--fg2); display:flex; align-items:center; gap:6px;}
.kpi .eb i{width:6px; height:6px; border-radius:2px; background:var(--elmi-red); display:inline-block;}
.kpi .val{font-family:var(--font-display); font-weight:800; font-size:34px; line-height:1; letter-spacing:-.025em; color:var(--fg1);}
.kpi .val.grad{background:var(--elmi-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;}
.kpi .val .u{font-size:15px; font-weight:600; color:var(--fg3); letter-spacing:0; margin-left:3px; -webkit-text-fill-color:var(--fg3);}
.kpi .cap{font-size:12px; color:var(--fg2); line-height:1.35;}
.kpi.dark{background:var(--bg-dark); border-color:rgba(255,255,255,.08);}
.kpi.dark .eb{color:#B8B8C2;} .kpi.dark .val{color:#fff;} .kpi.dark .cap{color:#B8B8C2;}

/* table */
.tbl-wrap{overflow-x:auto; border:1px solid var(--border-1); border-radius:var(--radius-md); background:var(--neutral-0);}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px;}
table.tbl th{
  text-align:right; font-weight:700; color:var(--fg2); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
  padding:12px 14px; border-bottom:1.5px solid var(--border-2); background:var(--neutral-50); white-space:nowrap; position:sticky; top:0;
}
table.tbl th:first-child, table.tbl td:first-child{text-align:left;}
table.tbl td{padding:11px 14px; border-bottom:1px solid var(--border-1); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-family:var(--font-mono); font-size:12.5px;}
table.tbl td:first-child{font-family:var(--font-body); font-weight:600; color:var(--fg1); font-size:13.5px;}
table.tbl tbody tr{transition:background 120ms;}
table.tbl tbody tr:hover{background:var(--neutral-50);}
table.tbl tr.total td{font-weight:700; color:var(--fg1); border-top:1.5px solid var(--border-2); background:var(--neutral-50);}
table.tbl tr.total td:first-child{color:var(--fg1);}
.tcell-pos{color:var(--success);} .tcell-neg{color:var(--elmi-red);} .tcell-mut{color:var(--fg3);}
.pill{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-body)!important; font-size:11px!important; font-weight:600; padding:3px 9px; border-radius:999px;}
.pill.cp1{background:rgba(227,32,40,.10); color:var(--elmi-red);}
.pill.cp2{background:rgba(109,42,153,.12); color:var(--elmi-purple);}
.pill.ok{background:rgba(31,157,85,.12); color:var(--success);}
.pill.warn{background:rgba(226,161,0,.16); color:#8a6300;}
.pill.mut{background:var(--neutral-100); color:var(--fg2);}

/* chart box */
.chart-box{position:relative; width:100%;}
.chart-box canvas{display:block;}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:4px;}
.legend .li{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--fg2); font-weight:600;}
.legend .li .sw{width:12px; height:12px; border-radius:4px;}

/* ---------- Eingabe (input) page ---------- */
.input-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:16px; align-items:start;}
@media(max-width:980px){.input-grid{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.field > label{font-size:12px; color:var(--fg2); font-weight:700; letter-spacing:.02em;}
.field .hint{font-size:11px; color:var(--fg3); font-weight:500;}
input[type=date]{
  font-family:var(--font-body); font-size:14px; color:var(--fg1); height:44px; padding:0 14px;
  background:var(--bg1); border:1px solid var(--border-1); border-radius:12px; outline:none; transition:border-color 140ms; width:100%;
}
input[type=date]:focus{border-color:var(--elmi-red); box-shadow:0 0 0 3px rgba(227,32,40,.18);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* toggle chips */
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip-tog{
  appearance:none; border:1.5px solid var(--border-2); background:var(--bg1); color:var(--fg2);
  font-family:var(--font-body); font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer;
  transition:all 140ms var(--ease-out); display:inline-flex; align-items:center; gap:7px;
}
.chip-tog:hover{border-color:var(--neutral-400); color:var(--fg1);}
.chip-tog.on{background:var(--neutral-900); border-color:var(--neutral-900); color:#fff;}
.chip-tog.on.accent{background:var(--elmi-red); border-color:var(--elmi-red);}
.chip-tog .dotc{width:7px; height:7px; border-radius:999px; background:currentColor; opacity:.5;}
.chip-tog.on .dotc{opacity:1;}

/* segmented */
.seg{display:inline-flex; background:var(--neutral-100); border-radius:12px; padding:4px; gap:4px;}
.seg button{
  appearance:none; border:0; background:transparent; cursor:pointer; font-family:var(--font-body);
  font-size:13px; font-weight:600; color:var(--fg2); padding:8px 16px; border-radius:9px; transition:all 140ms;
}
.seg button.on{background:var(--neutral-0); color:var(--fg1); box-shadow:var(--shadow-1);}
.seg button.on.accent{background:var(--elmi-red); color:#fff;}

/* dual slider */
.slider-wrap{padding:6px 4px 2px;}
.slider-vals{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--fg1); margin-bottom:10px;}
.dual{position:relative; height:34px;}
.dual .track{position:absolute; top:15px; left:0; right:0; height:4px; border-radius:2px; background:var(--neutral-200);}
.dual .fill{position:absolute; top:15px; height:4px; border-radius:2px; background:var(--elmi-gradient);}
.dual input[type=range]{position:absolute; top:0; left:0; width:100%; height:34px; margin:0; background:none; pointer-events:none; -webkit-appearance:none; appearance:none;}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; pointer-events:auto; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--elmi-red); box-shadow:var(--shadow-2); cursor:pointer; margin-top:0;}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--elmi-red); box-shadow:var(--shadow-2); cursor:pointer;}

/* info bar / button */
.infobar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--bg-dark); color:#fff; border-radius:var(--radius-md); padding:18px 22px; margin-top:6px;
}
.infobar .big{font-family:var(--font-display); font-weight:800; font-size:30px; line-height:1; letter-spacing:-.02em;}
.infobar .big .u{font-size:14px; color:#B8B8C2; font-weight:600; margin-left:4px;}
.infobar .txt{font-size:13px; color:#B8B8C2; line-height:1.4;}
.infobar .spacer{flex:1;}
.btn{
  height:46px; padding:0 26px; border-radius:999px; display:inline-flex; align-items:center; gap:9px;
  font-family:var(--font-body); font-weight:700; font-size:15px; border:0; cursor:pointer; transition:transform 140ms var(--ease-out);
}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--elmi-gradient); color:#fff; box-shadow:var(--shadow-glow);}
.btn.ghost{background:transparent; border:1.5px solid var(--neutral-300); color:var(--fg1);}
.btn.ghost-d{background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.2); color:#fff;}
.btn.sm{height:38px; padding:0 16px; font-size:13px; font-weight:600;}
.btn svg{width:16px; height:16px;}

<!-- Zugangsschutz (Hash wird beim Deploy injiziert) -->
<script>
(function(){
  const KEY="elmi_auth_37910", PWD_HASH="__ELMI_AI_PWD_HASH__";

  /* Lokaler Entwicklungs-Bypass.
     Der echte Hash wird erst beim Deploy per sed in diese Datei injiziert
     (siehe .github/workflows/deploy-pages.yml). Im Repo steht nur der
     Platzhalter, gegen den kein Passwort matchen kann - lokal waere die
     Seite also gar nicht erreichbar.
     Wir ueberspringen das Gate deshalb genau dann, wenn BEIDES zutrifft:
       1. PWD_HASH ist kein gueltiger SHA-256-Hex (also nicht injiziert), und
       2. die Seite laeuft auf localhost bzw. file://.
     Auf github.io greift der Schutz damit unveraendert - auch dann, wenn
     die Injektion im Workflow einmal fehlschlagen sollte. */
  const HASH_INJECTED = /^[0-9a-f]{64}$/.test(PWD_HASH);
  const IS_LOCAL = location.protocol === "file:" ||
                   ["localhost","127.0.0.1","[::1]",""].indexOf(location.hostname) !== -1;
  const DEV_BYPASS = !HASH_INJECTED && IS_LOCAL;

  async function sha256hex(s){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  async function doLogin(){
    const inp=document.getElementById("elmiLoginPwd");
    const overlay=document.getElementById("elmiLoginOverlay");
    if(!inp||!overlay) return;
    const h=await sha256hex(inp.value);
    if(h===PWD_HASH){
      sessionStorage.setItem(KEY,PWD_HASH);
      overlay.style.display="none";
    } else {
      const err=document.getElementById("elmiLoginErr");
      if(err) err.textContent="Incorrect password.";
      inp.value=""; inp.focus();
    }
  }

  // Lock elmiCheckLogin so bundle scripts cannot overwrite it
  Object.defineProperty(window,"elmiCheckLogin",{
    get:function(){return doLogin;},
    set:function(){},
    configurable:false
  });

  function checkSession(){
    if(DEV_BYPASS || sessionStorage.getItem(KEY)===PWD_HASH){
      const o=document.getElementById("elmiLoginOverlay");
      if(o) o.style.display="none";
    }
  }

  function makeBtn(){
    const a=document.createElement("a");
    a.id="elmi-back-btn";
    a.href="../";
    a.textContent="← Zurück";
    a.style.cssText="flex-shrink:0;display:inline-flex;align-items:center;white-space:nowrap;padding:6px 12px;margin-right:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#ccc;font:12px/1 system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:background .2s;z-index:1";
    a.onmouseover=function(){this.style.background="rgba(255,255,255,.14)";};
    a.onmouseout=function(){this.style.background="rgba(255,255,255,.07)";};
    return a;
  }

  function findTabBar(){
    // Try ARIA tablist first
    const tl=document.querySelector('[role="tablist"]');
    if(tl) return tl;
    // Find top-positioned flex/inline row with multiple children
    const candidates=Array.from(document.querySelectorAll("nav,header,[class*='tab'],[class*='nav'],[class*='menu'],[class*='toolbar']"));
    for(const el of candidates){
      const r=el.getBoundingClientRect();
      if(r.top<120 && r.width>200 && el.children.length>=2) return el;
    }
    // Fallback: any top-area element with 3+ children
    const all=Array.from(document.querySelectorAll("body > * > *,body > * > * > *"));
    for(const el of all){
      const r=el.getBoundingClientRect();
      if(r.top<80 && r.top>=0 && r.width>300 && el.children.length>=3) return el;
    }
    return null;
  }

  function injectBackBtn(){
    if(document.getElementById("elmi-back-btn")) return;
    const bar=findTabBar();
    if(bar && bar.parentElement){
      // Insert before the tab bar in its parent — avoids interfering with tab flex layout
      bar.parentElement.insertBefore(makeBtn(),bar);
    } else if(bar){
      // Fallback: prepend into bar but with absolute positioning so it doesn't push tabs
      const a=makeBtn();
      a.style.position="absolute";
      a.style.left="8px";
      bar.style.position="relative";
      bar.style.paddingLeft="90px";
      bar.insertBefore(a,bar.firstChild);
    } else {
      const a=makeBtn();
      a.style.cssText+="position:fixed;bottom:16px;left:16px;z-index:9999999;background:#1B1B22;border:1px solid rgba(255,255,255,.2)";
      document.body.appendChild(a);
    }
  }

  checkSession();
  // Re-inject after bundle replaces DOM
  setTimeout(function(){checkSession();injectBackBtn();},800);
  setTimeout(function(){if(!document.getElementById("elmi-back-btn")){injectBackBtn();}},2500);
})();
</script>

/* ---------- DOM helpers ---------- */
function mk(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(kv){
    var k=kv[0],v=kv[1];
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null)continue;
    if(typeof c==='string'||typeof c==='number'){e.appendChild(document.createTextNode(String(c)));continue;}
    if(c instanceof Node){e.appendChild(c);continue;}
    console.error('[ELMI FP mk] Skipped non-Node child for <'+tag+'>:',c);
  }
  return e;
}

function buildTbl(headers,rows){
  var thead=mk('thead',null,mk('tr',null));
  headers.forEach(function(h){thead.firstChild.appendChild(mk('th',null,h));});
  var tbody=mk('tbody',null);
  rows.forEach(function(row){
    var tr=mk('tr',row.cls?{'class':row.cls}:null);
    row.cells.forEach(function(c,i){
      var td=mk('td',{style:{textAlign:i===0?'left':'right',fontWeight:row.bold?'700':'',color:c.color||''}});
      if(c.v&&typeof c.v==='object')td.appendChild(c.v);
      else td.textContent=c.v!=null?c.v:c;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  return mk('div',{'class':'tbl-wrap'},mk('table',{'class':'tbl'},thead,tbody));
}

/* ---------- Language toggle button ---------- */
function updateLangBtns(){

    var b=document.getElementById('elmi-lang-btn-'+l);

function injectLangToggle(){
  if(document.getElementById('elmi-lang-toggle'))return;
  /* Target the upper appbar section — try .appbar-top first, fall back to .appbar */
  var target=document.querySelector('.appbar-top')||document.querySelector('.appbar');
  if(!target){
    var _lp=0,_lpi=setInterval(function(){
      _lp++;
      if(document.getElementById('elmi-lang-toggle')||_lp>60){clearInterval(_lpi);return;}
      var g=document.querySelector('.appbar-top')||document.querySelector('.appbar');
      if(g){clearInterval(_lpi);injectLangToggle();}
    },100);
    return;
  }
  var wrap=mk('div',{id:'elmi-lang-toggle','class':'lang-switcher',style:'display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;white-space:nowrap'});
  ['en','de'].forEach(function(lang){
    var btn=mk('button',{
      id:'elmi-lang-btn-'+lang,
      style:'background:transparent;border:1px solid rgba(0,0,0,0.22);border-radius:6px;padding:4px 11px;cursor:pointer;font-size:12px;color:#555;transition:all .15s;white-space:nowrap;letter-spacing:.3px;line-height:1.4'
    },lang==='en'?'EN':'DE');
    var flag=mk('span',{style:'margin-right:4px;font-size:14px;line-height:1'},lang==='en'?'🇬🇧':'🇩🇪');
    btn.insertBefore(flag,btn.firstChild);
    btn.addEventListener('click',function(){
      if(LANG===lang)return;
      LANG=lang;
      localStorage.setItem('elmi_lang',lang);
      updateLangBtns();
      /* Re-render whichever custom page is active */
      var h=location.hash;

      if(h==='#input'){
        var card=document.getElementById('elmi-fp-card');

        injectSettingsCard();

      var card2=document.getElementById('elmi-fp-card');
      if(card2){card2.parentNode.removeChild(card2);injectSettingsCard();}
    });
    wrap.appendChild(btn);
  });
  target.appendChild(wrap);
  updateLangBtns();
}

function showPdfToast(msg,type){
  var host=document.querySelector('.toast-host');
  if(!host){host=document.createElement('div');host.className='toast-host';document.body.appendChild(host);}
  var t=document.createElement('div');
  t.className='toast '+(type||'');
  t.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 5v4m0 2h.01"/></svg><span>'+msg+'</span>';
  host.appendChild(t);
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('in');});});
  setTimeout(function(){t.classList.remove('in');setTimeout(function(){t.remove();},400);},3500);

async function exportAllPagesPDF(){
  var btn=document.getElementById('elmi-pdf-export-btn');
  if(!btn||btn.disabled)return;
  setPdfBtnState(btn,true);
  showPdfToast('PDF wird vorbereitet…');
  try{
    /* Views aus ELMI.app.TABS — unabhängig von DOM-Attributen */
    var views=[];
    if(window.ELMI&&ELMI.app&&ELMI.app.TABS){
      views=ELMI.app.TABS.map(function(t){return t.id;}).filter(Boolean);
    }
    if(!views.length){
      /* Fallback: DOM-Tabs */
      views=Array.from(document.querySelectorAll('.tab[data-view],.tab[data-id],.tab[data-tab]'))
        .map(function(t){return t.getAttribute('data-view')||t.getAttribute('data-id')||t.getAttribute('data-tab');})
        .filter(Boolean);
    }
    /* Erster nicht-input View als Restore-Ziel */
    var activeView=views.find(function(v){return v!=='input';})||null;
    showPdfToast('v15 | views:'+views.length+' | '+views.slice(0,3).join(','));

    /* Inline-Styles aus dem Dokument (nur <style>-Elemente, keine externen Sheets) */
    var inlineCSS='';
    document.querySelectorAll('style').forEach(function(s){ inlineCSS+=s.innerHTML+'\n'; });

    /* Absolute URLs für externe Stylesheets */
    var base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');
    var cssLinks=[
      '<link rel="stylesheet" href="'+base+'../design.css">',
      '<link rel="stylesheet" href="'+base+'../assets/css/responsive.css">'
    ].join('');

    /* DOM-Tab-Buttons für Klick-Navigation */
    var domTabs=Array.from(document.querySelectorAll('.tab'));

    /* Alle Tabs als HTML-Snapshots erfassen */
    var pageHtmls=[];
    for(var i=0;i<views.length;i++){
      var view=views[i];
      /* Settings/Input-Tab überspringen */
      if(view==='input')continue;

      /* Tab per DOM-Click navigieren (ELMI lädt dann selbst die nötigen Daten) */
      var tabIdx=window.ELMI&&ELMI.app&&ELMI.app.TABS
        ?ELMI.app.TABS.findIndex(function(t){return t.id===view;}):-1;
      var domTab=tabIdx>=0?domTabs[tabIdx]:null;
      if(domTab){
        domTab.click();
      }else{
        try{
          if(window.ELMI&&ELMI.pages&&ELMI.pages[view])ELMI.pages[view]();
        }catch(e){
          console.warn('[PDF] skip view',view,e.message);
          continue;
        }
      }
      await new Promise(function(r){setTimeout(r,2500);});

      /* Haupt-Container suchen */
      var src=document.getElementById('content')
        ||document.querySelector('main')
        ||document.querySelector('.main-content')
        ||document.querySelector('.app-content')
        ||document.querySelector('.view-content')
        ||document.querySelector('[class*="content"]:not([id*="login"]):not([id*="overlay"])')
        ||document.querySelector('.page');

      if(!src){
        /* Letzter Ausweg: body-Clone ohne Overlay */
        var overlay=document.getElementById('elmiLoginOverlay');
        var backBtn=document.getElementById('elmi-back-btn');
        var oParent=overlay&&overlay.parentNode;var oSib=overlay&&overlay.nextSibling;
        var bParent=backBtn&&backBtn.parentNode;var bSib=backBtn&&backBtn.nextSibling;
        if(overlay)oParent.removeChild(overlay);
        if(backBtn)bParent.removeChild(backBtn);
        src=document.body;
        var bodyClone=src.cloneNode(true);
        if(overlay)oParent.insertBefore(overlay,oSib);
        if(backBtn)bParent.insertBefore(backBtn,bSib);
        /* Login-Reste im Clone entfernen */
        ['elmiLoginOverlay','elmi-back-btn','elmi-pdf-export-btn','elmi-lang-toggle'].forEach(function(id){
          var el=bodyClone.querySelector('#'+id);if(el)el.remove();
        });
        pageHtmls.push('<div class="elmi-pdf-page">'+bodyClone.innerHTML+'</div>');
        console.log('[PDF] fallback body used für view',view);
        continue;
      }
      console.log('[PDF] container:',src.tagName,src.id||src.className.slice(0,30),'für view',view);

      /* Canvas → Data-URL vor clone */
      src.querySelectorAll('canvas').forEach(function(c){
        try{ c.setAttribute('data-pdf-src',c.toDataURL('image/png')); }catch(e){}
      });

      var clone=src.cloneNode(true);

      /* Im Clone: canvas durch <img> ersetzen */
      clone.querySelectorAll('canvas[data-pdf-src]').forEach(function(c){
        var img=document.createElement('img');
        img.src=c.getAttribute('data-pdf-src');
        img.style.cssText='width:'+c.width+'px;height:'+c.height+'px;display:block;max-width:100%;';
        c.parentNode.replaceChild(img,c);
      });
      src.querySelectorAll('canvas[data-pdf-src]').forEach(function(c){ c.removeAttribute('data-pdf-src'); });

      pageHtmls.push('<div class="elmi-pdf-page">'+clone.outerHTML+'</div>');
    }

    if(!pageHtmls.length){
      showPdfToast('Kein Inhalt gefunden – #content Element fehlt','error');
      setPdfBtnState(btn,false);
      return;
    }

    /* Tabs wiederherstellen */
    /* Zum ersten Tab zurücknavigieren via DOM-Click */
    if(activeView&&window.ELMI&&ELMI.app&&ELMI.app.TABS){
      var restoreIdx=ELMI.app.TABS.findIndex(function(t){return t.id===activeView;});
      if(restoreIdx>=0&&domTabs[restoreIdx])domTabs[restoreIdx].click();
    }

    /* Blob-URL mit Self-Print */
    var printCSS=[
      inlineCSS,
      'body{margin:0;padding:0;background:#fff;}',
      '.elmi-pdf-page{page-break-after:always;box-sizing:border-box;padding:8mm;background:#fff;min-height:180mm;}',
      '.elmi-pdf-page:last-child{page-break-after:avoid;}',
      '@page{size:A4 landscape;margin:10mm;}'
    ].join('\n');

    var fullHtml=[
      '<!DOCTYPE html><html><head><meta charset="utf-8">',
      cssLinks,
      '<style>',printCSS,'</style>',
      '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},1200);});<\/script>',
      '</head><body>',
      pageHtmls.join(''),
      '</body></html>'
    ].join('');

    /* Download als HTML (kein Popup nötig) */
    var blob=new Blob([fullHtml],{type:'text/html;charset=utf-8'});
    var blobUrl=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=blobUrl;
    a.download='ELMI-Report.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); },5000);
    showPdfToast('Download gestartet – Datei öffnen → Strg+P → "Als PDF speichern" ✓','ok');

  }catch(err){
    console.error('[PDF] Fehler:',err);
    showPdfToast('Fehler: '+err.message,'error');
  }finally{
    setPdfBtnState(btn,false);
  }
}

/* ---------- Financial Performance renderer ---------- */
function renderFP(m){
  var s=cfg();
  var state=window.ELMI.app.state();
  var dcKwh=m.dcKwh||0;
  var acKwh=m.acKwh||0;
  var nSess=(m.sessDur||[]).length;

  var umsatz=dcKwh*s.stromVerkauf;
  var cogs=acKwh*s.stromEinkauf;
  var gm=umsatz-cogs;
  var gmPct=umsatz>0?(gm/umsatz*100):0;
  var uPerSess=nSess>0?umsatz/nSess:0;
  var cPerSess=nSess>0?cogs/nSess:0;

  var finMin=m.finishingMin||0;
  var billedMin=Math.max(0,finMin-nSess*s.blockierFrei);
  var blockMenge,blockUnit,blockPreisStr;
  if(s.blockierModus==='stunde'){
    blockMenge=Math.ceil(billedMin/60);
    blockUnit='h';
    blockPreisStr=fPriceH(s.blockierPreis);
  } else {
    var avgFinPerSess=nSess>0?finMin/nSess:0;
    blockMenge=Math.min(nSess,Math.ceil(billedMin/Math.max(1,avgFinPerSess)));
    blockUnit='sessions';
    blockPreisStr=fPriceSess(s.blockierPreis);
  }
  var blockWert=blockMenge*s.blockierPreis;
  var thgU=dcKwh*s.thgVerkauf;
  var thgC=dcKwh*s.thgEinkauf;
  var addGM=blockWert+thgU-thgC;
  var totalGM=gm+addGM;

  var GREEN='#1a8a4a',RED='#c0392b',PROJ='#5A6A7A';

  var periodDays=m.D||(function(){
    try{var d1=new Date(state.dateFrom),d2=new Date(state.dateTo);
      return Math.max(1,Math.round((d2-d1)/86400000)+1);}
    catch(e){return 30;}
  })();
  var yf=365/Math.max(1,periodDays);
  function fEurY(n){return mk('span',{style:'color:'+PROJ+';font-style:italic'},fEur(n*yf));}
  var YHD=t('hProjection');

  var page=document.querySelector('.page');
  if(!page){
    page=document.createElement('div');
    page.className='page';
    var cnt=document.getElementById('content');
    if(!cnt)return;
    cnt.appendChild(page);
  }
  page.replaceChildren();

  page.appendChild(mk('div',{'class':'page-head'},
    mk('div',{'class':'ph-l'},
      mk('div',{'class':'eyebrow'},t('eyebrow')),
      mk('h1',null,t('pageTitle')),
      mk('div',{'class':'lead'},
        t('pageLead')+' · '+state.dateFrom+' - '+state.dateTo+
        ' · '+nSess+' '+t('sessions')+' · '+t('basisDays')+' '+periodDays+' '+t('days'))
    )
  ));

  page.appendChild(mk('div',{'class':'section-title'},t('sCore')));
  page.appendChild(buildTbl(
    [t('hFinancials'),t('hEnergyVol'),t('hUnitPrice'),t('hValue'),YHD],
    [
      {cells:[{v:t('revenue')},{v:fKwh(dcKwh)},{v:fPriceKwh(s.stromVerkauf)},{v:fEur(umsatz)},{v:fEurY(umsatz)}]},
      {cells:[{v:t('cogs')},{v:fKwh(acKwh)},{v:fPriceKwh(s.stromEinkauf)},{v:fEur(cogs)},{v:fEurY(cogs)}]},
      {bold:true,cells:[
        {v:t('grossMargin')},{v:''},{v:fDE(gmPct,1)+' %'},
        {v:fEur(gm),color:gm>=0?GREEN:RED},{v:fEurY(gm)}
      ]}
    ]
  ));

  page.appendChild(mk('div',{'class':'section-title'},t('sAdditional')));
  page.appendChild(buildTbl(
    [t('hFinancials'),t('hEnergyVol'),t('hUnitPrice'),t('hValue'),YHD],
    [
      {cells:[{v:t('blockingRevenue')},{v:fDE(blockMenge,0)+' '+blockUnit},{v:blockPreisStr},{v:fEur(blockWert)},{v:fEurY(blockWert)}]},
      {cells:[{v:t('thgRevenue')},{v:fKwh(dcKwh)},{v:fPriceKwh(s.thgVerkauf)},{v:fEur(thgU)},{v:fEurY(thgU)}]},
      {cells:[{v:t('thgCogs')},{v:fKwh(dcKwh)},{v:fPriceKwh(s.thgEinkauf)},{v:fEur(thgC)},{v:fEurY(thgC)}]},
      {bold:true,cells:[
        {v:t('additionalGM')},{v:''},{v:''},
        {v:fEur(addGM),color:addGM>=0?GREEN:RED},{v:fEurY(addGM)}
      ]}
    ]
  ));

  page.appendChild(mk('div',{'class':'section-title'},t('sTotal')));
  page.appendChild(buildTbl(
    [t('hFinancials'),'','',t('hValue'),YHD],
    [{bold:true,cells:[
      {v:t('totalGM')},{v:''},{v:''},
      {v:fEur(totalGM),color:totalGM>=0?GREEN:RED},{v:fEurY(totalGM)}
    ]}]
  ));

  page.appendChild(mk('div',{'class':'section-title'},t('sPerSession')));
  page.appendChild(buildTbl(
    [t('hFinancials'),t('hPerSess'),t('hProj')],
    [
      {cells:[{v:t('revenuePerSess')},{v:fDE(uPerSess,2)+' EUR/session'},{v:mk('span',{style:'color:'+PROJ+';font-style:italic'},fEur(uPerSess*nSess*yf))}]},
      {cells:[{v:t('cogsPerSess')},{v:fDE(cPerSess,2)+' EUR/session'},{v:mk('span',{style:'color:'+PROJ+';font-style:italic'},fEur(cPerSess*nSess*yf))}]}
    ]
  ));

  var noteText=t('noteTemplate').replace('{d}',periodDays).replace('{f}',fDE(yf,2));
  page.appendChild(mk('div',{'class':'note',style:'margin-top:16px;font-size:12px;color:#4A4A55'},noteText));
}

/* ---------- Hook into ELMI app ---------- */
function hookElmi(){
  var ELMI=window.ELMI;
  if(!ELMI||!ELMI.app||!ELMI.pages)return false;

  var rt=ELMI.app.TABS.find(function(tb){return tb.id==='roadmap';});
  if(rt){rt.label='Financial Performance';rt.short='Financial';}
  var domTab=document.querySelector('.tab:last-child');
  if(domTab){
    domTab.textContent='';
    var numSpan=document.createElement('span');
    numSpan.className='num';
    numSpan.textContent='10';
    domTab.appendChild(numSpan);
    domTab.appendChild(document.createTextNode('Financial'));
  }

  ELMI.pages.roadmap=function(m){renderFP(m||ELMI.app.metrics());};

  /* Watch #content for the Settings .page appearing — don't wrap origInput (causes bundle error) */
  var _contentEl=document.getElementById('content');
  if(_contentEl){
    var _obs=new MutationObserver(function(){
      if(location.hash==='#input')injectSettingsCard();
    });
    _obs.observe(_contentEl,{childList:true,subtree:true});
  }

  injectLangToggle();
  injectPdfExportBtn();

  if(location.hash==='#input')setTimeout(injectSettingsCard,100);
  if(location.hash==='#roadmap')renderFP(ELMI.app.metrics());

  return true;
}

var _attempts=0;
var _iv=setInterval(function(){
  _attempts++;
  if(hookElmi()||_attempts>40)clearInterval(_iv);
},200);

})();

  'Scope average (all bat_soc > 0)':'Durchschnitt (bat_soc > 0)',
  'Discharged from storage':'Aus Speicher entladen',
  'Charged from grid/PV (bat_kw > 0)':'Geladen aus Netz/PV',
  'Minutes without active charging':'Minuten ohne aktives Laden',
  // data-info-label (short caps labels in settings bar)
  'Source ':'Quelle ',  // with trailing space (CSS uppercase)
  // button texts
  'Unpacking...':'Entpacken...'
};

/* Build reverse map DE→EN for when switching back to English */
var TEXT_EN = {};
Object.keys(TEXT_DE).forEach(function(enStr){
  var deStr = TEXT_DE[enStr];
  if (deStr !== enStr) TEXT_EN[deStr] = enStr;
});
/* Also add the German header-sub → English */
TEXT_EN['CPO · Ladesessions · Energieanalyse'] = 'CPO · Charging Sessions · Energy Analysis';

/* ── Apply text-node replacements ── */
function replaceTextNodes(root, map) {
  if (!root) return;
  var sortedKeys = Object.keys(map).sort(function(a,b){return b.length-a.length;});
  var walker = document.createTreeWalker(root, 1|4, {
    acceptNode: function(n) {
      if (n.nodeType === 1) {
        var tag = n.tagName;
        if (tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT') return 2; // skip
        return 1; // check children
      }
      if (n.nodeType === 3 && n.textContent.trim()) return 1;
      return 3;
    }
  }, false);
  var nodes = [];
  var n;
  while ((n = walker.nextNode())) {
    if (n.nodeType === 3) nodes.push(n);
  }
  nodes.forEach(function(node) {
    var orig = node.textContent;
    var changed = orig;
    sortedKeys.forEach(function(k) {
      if (changed.indexOf(k) !== -1) {
        changed = changed.split(k).join(map[k]);
      }
    });
    if (changed !== orig) node.textContent = changed;
  });
}

/* ── Translate nav buttons ── */
function translateNav() {
  var labels = (MLANG === 'de') ? NAV_DE : NAV_EN;
  document.querySelectorAll('.nav-btn[data-view]').forEach(function(btn) {
    var view = btn.getAttribute('data-view');
    if (!labels[view]) return;
    for (var i = btn.childNodes.length - 1; i >= 0; i--) {
      var nd = btn.childNodes[i];
      if (nd.nodeType === 3 && nd.textContent.trim()) {
        nd.textContent = ' ' + labels[view];
        break;
      }
    }
  });
}

/* ── Patch Chart.js instances ── */
var CHART_IDS = ['opd-c-hourly','opd-c-split','opd-c-daily',
  'opd-c-seshist','opd-c-sesday','opd-c-mode','opd-c-soc'];

function patchCharts() {
  if (typeof Chart === 'undefined') return;
  var map = (MLANG === 'de') ? CHART_DE : CHART_EN;
  CHART_IDS.forEach(function(id) {
    var canvas = document.getElementById(id);
    if (!canvas) return;
    var chart = Chart.getChart ? Chart.getChart(canvas) : canvas._chart;
    if (!chart) return;
    var changed = false;
    (chart.data.labels || []).forEach(function(l, i) {
      if (map[l]) { chart.data.labels[i] = map[l]; changed = true; }
    });
    (chart.data.datasets || []).forEach(function(ds) {
      if (map[ds.label]) { ds.label = map[ds.label]; changed = true; }
    });
    if (changed) { try { chart.update('none'); } catch(e){} }
  });
}

/* ── Translate header sub (only element outside #content with German text) ── */
function translateHeaderSub() {
  var el = document.querySelector('.header-sub');
  if (!el) return;
  if (MLANG === 'de') {
    el.textContent = 'CPO · Ladesessions · Energieanalyse';
  } else {
    el.textContent = 'CPO · Charging Sessions · Energy Analysis';
  }
}

/* ── Master apply ── */
function applyMainTranslations() {
  MLANG = localStorage.getItem('elmi_lang') || 'en';
  var map = (MLANG === 'de') ? TEXT_DE : TEXT_EN;
  translateNav();
  translateHeaderSub();
  var content = document.getElementById('content');
  replaceTextNodes(content || document.body, map);
  patchCharts();
}

/* ── Monkey-patch localStorage.setItem to react to lang changes ── */
var _origSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, val) {
  _origSetItem.call(this, key, val);
  if (key === 'elmi_lang' && this === localStorage) {
    MLANG = val;
    setTimeout(applyMainTranslations, 80);
  }
};

/* ── Hook into ELMI.pages to re-apply after each page render ── */
function hookMainPages() {
  var ELMI = window.ELMI;
  if (!ELMI || !ELMI.pages) return false;
  Object.keys(ELMI.pages).forEach(function(key) {
    if (key === 'roadmap') return; // handled by Financial script
    var orig = ELMI.pages[key];
    ELMI.pages[key] = function() {
      var r = orig.apply(this, arguments);
      setTimeout(applyMainTranslations, 60);
      return r;
    };
  });
  setTimeout(applyMainTranslations, 600);
  return true;
}

var _mhi = 0, _mhiv = setInterval(function() {
  _mhi++;
  if (hookMainPages() || _mhi > 60) clearInterval(_mhiv);
}, 200);

})();

<!-- Multi-Station-Loader (Ordner-Upload + mitgelieferte Demo-Daten) -->
<script>
/* ELMI Multi-Station Loader Extension v1
   Adds a "load all Excel files from a local folder" picker plus a
   station selector to the Settings (#input) tab. Reuses the bundle's
   own window.ELMI.parseWorkbook() / window.ELMI.app.applyDB() so every
   page recomputes exactly as it does for a single manual upload.
*/
(function(){
'use strict';

var Multi = { stations: [], activeSN: null };

function mk(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') { e.appendChild(document.createTextNode(String(c))); continue; }
    if (c instanceof Node) { e.appendChild(c); continue; }
    console.error('[ELMI Multi-Station mk] Skipped non-Node child for <'+tag+'>:', c);
  }
  return e;
}

function extractSN(fileName, dbSn){
  if (dbSn && dbSn !== '—') return String(dbSn);
  var m = fileName.match(/(?:SN[_\-]?)([A-Za-z]\d{3,6})/i);
  return m ? m[1].toUpperCase() : fileName.replace(/\.(xlsx|xls)$/i, '');
}

function ensureStyles(){
  if (document.getElementById('elmi-multi-station-css')) return;
  var css = ''
    + '#elmi-folder-section{margin-top:12px;padding:18px 20px;border:1.5px dashed var(--elmi-orange,#F39A3A);border-radius:var(--radius-md,8px);background:rgba(243,154,58,.06);}'
    + '#elmi-folder-section .settings-hint{font-size:12px;color:var(--fg2,#6b6b76);line-height:1.5;}'
    + '.elmi-status-box{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:12.5px;}'
    + '.elmi-status-box.ok{background:rgba(31,157,85,.12);color:#1F9D55;}'
    + '.elmi-status-box.warn{background:rgba(226,161,0,.16);color:#8a6300;}'
    + '.elmi-status-box.error{background:rgba(227,32,40,.12);color:#E32028;}'
    + '#elmi-station-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--neutral-100,#f4f4f6);border:1px solid var(--border-1,#e7e7eb);border-radius:10px;margin-bottom:18px;font-size:13px;}'
    + '#elmi-station-bar select{background:#fff;color:var(--fg1,#1b1b22);border:1px solid var(--border-2,#d1d1d8);border-radius:6px;padding:6px 10px;font-size:13px;min-width:280px;}'

    + 'border-radius:var(--radius-md,8px);background:var(--color-surface,rgba(243,154,58,.08));'
    + 'border:1px solid var(--color-accent,var(--elmi-orange,#F39A3A));font-size:13px;color:var(--fg1,#1b1b22);}'
    + '.banner-info button{cursor:pointer;}'
    + '.banner-info #btn-auto-load{padding:6px 12px;border:none;border-radius:6px;background:var(--color-accent,var(--elmi-orange,#F39A3A));color:#fff;font-size:12.5px;font-weight:600;}'
    + '.banner-info #btn-dismiss-banner{margin-left:auto;background:none;border:none;font-size:14px;color:var(--fg2,#6b6b76);}'
    + '.hidden{display:none!important;}'
    + '.elmi-status-box.info{background:rgba(30,120,220,.10);color:#1168cc;}'
    + '.btn-danger{display:inline-block;padding:7px 14px;border:none;border-radius:var(--radius-md,8px);background:#E32028;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}'
    + '.btn-danger:hover{filter:brightness(1.1);}';
  document.head.appendChild(mk('style', {id:'elmi-multi-station-css'}, css));
}

function showStatus(host, msg, type){
  host.textContent = msg;
  host.className = 'elmi-status-box ' + type;
  host.classList.remove('hidden');
}

/* ── IndexedDB persistence for the default folder handle ── */
var IDB_DB = 'elmi-cpo-settings', IDB_STORE = 'handles', IDB_KEY = 'defaultChargingDir';

async function saveDirectoryHandle(handle){
  if (!window.idb) return;
  var db = await window.idb.openDB(IDB_DB, 1, {
    upgrade: function(db){ db.createObjectStore(IDB_STORE); }
  });
  await db.put(IDB_STORE, handle, IDB_KEY);
  localStorage.setItem('defaultChargingDataDir', handle.name || 'Charging Stations Operating Datas');
}

async function getSavedDirectoryHandle(){
  if (!window.idb) return null;
  try{
    var db = await window.idb.openDB(IDB_DB, 1, {
      upgrade: function(db){ db.createObjectStore(IDB_STORE); }
    });
    var handle = await db.get(IDB_STORE, IDB_KEY);
    if (!handle) return null;
    var permission = await handle.queryPermission({mode: 'read'});
    if (permission === 'granted') return handle;
    var request = await handle.requestPermission({mode: 'read'});
    return request === 'granted' ? handle : null;
  }catch(e){ return null; }
}

function populateSelector(){
  var sel = document.getElementById('elmi-station-select');
  var bar = document.getElementById('elmi-station-bar');
  if (!sel || !bar) return;
  sel.innerHTML = '';
  Multi.stations.forEach(function(s){
    var opt = mk('option', {value: s.sn}, 'SN ' + s.sn + ' – ' + s.fileName);
    if (s.sn === Multi.activeSN) opt.selected = true;
    sel.appendChild(opt);
  });
  bar.classList.remove('hidden');
}

function buildSelectorBar(){
  var sel = mk('select', {id: 'elmi-station-select'});
  sel.addEventListener('change', function(){
    var st = Multi.stations.filter(function(s){ return s.sn === sel.value; })[0];
    if (!st) return;
    Multi.activeSN = st.sn;
    window.ELMI.app.applyDB(st.db, st.fileName);
  });
  return mk('div', {id: 'elmi-station-bar', class: 'hidden'},
    mk('label', {for: 'elmi-station-select'}, '⚡ Active Station:'), sel);
}

function buildFolderSection(){
  var status = mk('div', {id: 'elmi-folder-status', class: 'elmi-status-box hidden'});
  var defaultBtn = mk('button', {id: 'btn-load-default', class: 'btn-primary', type: 'button'},
    '⚡ Standard-Ordner laden (Charging Stations Operating Datas)');
  defaultBtn.addEventListener('click', function(){
    loadDefaultFolder(status);
  });
  if (!('showDirectoryPicker' in window)) {
    defaultBtn.disabled = true;
    defaultBtn.title = 'Nur in Chrome/Edge verfügbar. Bitte Ordner manuell auswählen.';
  }
  var manualHint = mk('p', {class: 'input-hint'}, 'Oder wähle manuell einen anderen Ordner:');
  var btn = mk('button', {id: 'elmi-btn-pick-folder', class: 'btn ghost sm', type: 'button'},
    '📁 Select Folder & Load All Stations');
  btn.addEventListener('click', function(){
    loadFolder(status);
  });
  var hint = mk('div', {class: 'settings-hint'},
    'Load every Excel file from a local folder (e.g. a synced OneDrive directory) in one go — no need to upload files one by one.');

  // === ELMI PATCH: IndexedDB Persist [ABSCHNITT C] — Löschen-Button ===
  var deleteBtn = mk('button', {id: 'elmi-btn-delete-data', class: 'btn-danger', type: 'button'},
    '🗑️ Gespeicherte Daten löschen');
  deleteBtn.addEventListener('click', async function(){
    await clearPersistedStations();
    Multi.stations = [];
    Multi.activeSN = null;
    var sel = document.getElementById('elmi-station-select');
    var bar = document.getElementById('elmi-station-bar');
    if (sel) sel.innerHTML = '';
    if (bar) bar.classList.add('hidden');
    showStatus(status, '🗑️ Gespeicherte Daten wurden gelöscht.', 'warn');
  });

  return mk('div', {id: 'elmi-folder-section'},
    mk('div', {class: 'section-title', style: {marginTop: '0'}}, '📂 Load from Folder'),
    mk('div', {style: {marginTop: '4px'}}, defaultBtn),
    manualHint, hint, mk('div', {style: {marginTop: '10px'}}, btn),
    mk('div', {style: {marginTop: '6px'}}, deleteBtn),
    status);
}

async function loadFromDirectoryHandle(dirHandle, status){
  var loaded = [];
  for await (var entry of dirHandle.values()) {
    if (entry.kind === 'file' && /\.(xlsx|xls)$/i.test(entry.name)) {
      try{
        var file = await entry.getFile();
        var db = await window.ELMI.parseWorkbook(file);
        loaded.push({sn: extractSN(entry.name, db.sn), fileName: entry.name, db: db});
      }catch(fileErr){
        console.error('[multi-station] failed to parse', entry.name, fileErr);
      }
    }
  }
  if (!loaded.length) {
    showStatus(status, '⚠️ No readable Excel files found in that folder.', 'warn');
    return false;
  }
  Multi.stations = loaded;
  Multi.activeSN = loaded[0].sn;
  populateSelector();
  window.ELMI.app.applyDB(loaded[0].db, loaded[0].fileName);

  // === ELMI PATCH: IndexedDB Persist [ABSCHNITT A+D] — nach Load speichern ===
  await persistStations(loaded);
  var ts = fmtTimestamp(localStorage.getItem('elmi_last_upload'));
  if (status) showStatus(status,
    '✅ Daten gespeichert — ' + loaded.length + ' Station(en), ' + ts, 'ok');

  return loaded;
}

async function loadFolder(status){
  if (!('showDirectoryPicker' in window)) {
    showStatus(status, '⚠️ This browser does not support the folder picker. Please use Chrome or Edge.', 'warn');
    return;
  }
  try{
    var dirHandle = await window.showDirectoryPicker({mode: 'read'});
    await loadFromDirectoryHandle(dirHandle, status);
    // Status wird bereits in loadFromDirectoryHandle gesetzt
  }catch(err){
    if (err.name !== 'AbortError') showStatus(status, '❌ Error loading folder: ' + err.message, 'error');
  }
}

async function loadDefaultFolder(status){
  if (!('showDirectoryPicker' in window)) {
    showStatus(status, '⚠️ This browser does not support the folder picker. Please use Chrome or Edge.', 'warn');
    return;
  }
  try{
    var dirHandle = await window.showDirectoryPicker({mode: 'read'});
    await saveDirectoryHandle(dirHandle);
    await loadFromDirectoryHandle(dirHandle, status);
    // Status (inkl. Persist-Bestätigung) wird in loadFromDirectoryHandle gesetzt
    hideAutoLoadBanner();
  }catch(err){
    if (err.name !== 'AbortError') showStatus(status, '❌ Error loading folder: ' + err.message, 'error');
  }
}

/* ── Auto-load banner ── */
function buildAutoLoadBanner(){
  var nameEl = mk('strong', {id: 'saved-folder-name'});
  var loadBtn = mk('button', {id: 'btn-auto-load', type: 'button'}, 'Automatisch laden');
  var dismissBtn = mk('button', {id: 'btn-dismiss-banner', type: 'button'}, '✕');
  var banner = mk('div', {id: 'auto-load-banner', class: 'banner-info', style: {display: 'none'}},
    mk('span', {}, '📁 Gespeicherter Ordner erkannt: ', nameEl),
    loadBtn, dismissBtn);
  dismissBtn.addEventListener('click', function(){ banner.style.display = 'none'; });
  return banner;
}

function hideAutoLoadBanner(){
  var banner = document.getElementById('auto-load-banner');
  if (banner) banner.style.display = 'none';
}

async function showAutoLoadBanner(handle){
  var banner = document.getElementById('auto-load-banner');
  if (!banner) return;
  var nameEl = document.getElementById('saved-folder-name');
  if (nameEl) nameEl.textContent = handle.name || localStorage.getItem('defaultChargingDataDir') || 'Ordner';
  var loadBtn = document.getElementById('btn-auto-load');
  if (loadBtn) {
    loadBtn.onclick = async function(){
      var status = document.getElementById('elmi-folder-status');
      try{
        var loaded = await loadFromDirectoryHandle(handle, status);
        if (loaded && status) showStatus(status, '✅ Loaded ' + loaded.length + ' station(s): ' + loaded.map(function(s){ return s.sn; }).join(', '), 'ok');
        banner.style.display = 'none';
      }catch(err){
        if (status) showStatus(status, '❌ Error loading folder: ' + err.message, 'error');
      }
    };
  }
  banner.style.display = 'flex';
}

async function initAutoLoadBanner(){
  var savedHandle = await getSavedDirectoryHandle();
  if (savedHandle) showAutoLoadBanner(savedHandle);
}

// === ELMI PATCH: IndexedDB Persist [ABSCHNITT A/B/C/D] — Hilfsfunktionen ===
var PERSIST_DB = 'elmi_cpo_db', PERSIST_STORE = 'stations_data', PERSIST_KEY = 'last_stations';

async function openPersistDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(PERSIST_DB, 1);
    req.onupgradeneeded = function(e){ e.target.result.createObjectStore(PERSIST_STORE); };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
}

function safeSerialize(obj){
  // Deep-clone via JSON round-trip; drops non-serializable values (functions, etc.)
  try{ return JSON.parse(JSON.stringify(obj)); }catch(e){ return null; }
}

// === ELMI PATCH: IndexedDB Persist [ABSCHNITT A] — Stationen speichern ===
async function persistStations(stations){
  try{
    var serializable = stations.map(function(s){
      return { sn: s.sn, fileName: s.fileName, db: safeSerialize(s.db) };
    }).filter(function(s){ return s.db !== null; });
    if (!serializable.length) return;
    var db = await openPersistDB();
    var tx = db.transaction(PERSIST_STORE, 'readwrite');
    tx.objectStore(PERSIST_STORE).put(serializable, PERSIST_KEY);
    await new Promise(function(res, rej){ tx.oncomplete = res; tx.onerror = function(e){ rej(e.target.error); }; });
    db.close();
    localStorage.setItem('elmi_last_upload', new Date().toISOString());
  }catch(err){ console.error('[elmi-persist] save failed', err); }
}

// === ELMI PATCH: IndexedDB Persist [ABSCHNITT B] — Stationen laden ===
async function loadPersistedStations(){
  try{
    var db = await openPersistDB();
    var result = await new Promise(function(res, rej){
      var tx = db.transaction(PERSIST_STORE, 'readonly');
      var req = tx.objectStore(PERSIST_STORE).get(PERSIST_KEY);
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(e){ rej(e.target.error); };
    });
    db.close();
    return result || null;
  }catch(err){ return null; }
}

// === ELMI PATCH: IndexedDB Persist [ABSCHNITT C] — Daten löschen ===
async function clearPersistedStations(){
  try{
    var db = await openPersistDB();
    var tx = db.transaction(PERSIST_STORE, 'readwrite');
    tx.objectStore(PERSIST_STORE).clear();
    await new Promise(function(res, rej){ tx.oncomplete = res; tx.onerror = function(e){ rej(e.target.error); }; });
    db.close();
  }catch(err){ console.error('[elmi-persist] clear failed', err); }
  localStorage.removeItem('elmi_last_upload');
}

function fmtTimestamp(iso){
  if (!iso) return '';
  try{
    var d = new Date(iso);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var yyyy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,'0');
    var min = String(d.getMinutes()).padStart(2,'0');
    return dd+'.'+mm+'.'+yyyy+' '+hh+':'+min;
  }catch(e){ return iso; }
}

/* ── Bundled fallback data (committed in /data) ──
   Works for everyone who opens the page — including external visitors
   without local file-system access — since the files ship with the repo
   instead of requiring a local folder pick. */
var BUNDLED_DATA_URL = 'data/manifest.json';
var _bundledLoaded = false;

async function loadBundledData(){
  if (_bundledLoaded) return;
  if (!window.ELMI || !window.ELMI.parseWorkbook || !window.ELMI.app) return;
  _bundledLoaded = true;
  try{
    var manifestRes = await fetch(BUNDLED_DATA_URL);
    if (!manifestRes.ok) return;
    var fileNames = await manifestRes.json();
    var loaded = [];
    for (var i = 0; i < fileNames.length; i++) {
      var name = fileNames[i];
      try{
        var res = await fetch('data/' + name);
        if (!res.ok) continue;
        var blob = await res.blob();
        var file = new File([blob], name);
        var db = await window.ELMI.parseWorkbook(file);
        loaded.push({sn: extractSN(name, db.sn), fileName: name, db: db});
      }catch(fileErr){
        console.error('[multi-station] failed to load bundled file', name, fileErr);
      }
    }
    if (!loaded.length) return;
    Multi.stations = loaded;
    Multi.activeSN = loaded[0].sn;
    populateSelector();
    window.ELMI.app.applyDB(loaded[0].db, loaded[0].fileName);
  }catch(err){
    console.error('[multi-station] failed to load bundled dataset', err);
  }
}

// === ELMI PATCH: IndexedDB Persist [ABSCHNITT B] — Startup-Restore ===
var _persistRestored = false;
async function tryRestoreFromIDB(){
  if (_persistRestored) return;
  _persistRestored = true;
  var stations = await loadPersistedStations();
  if (!stations || !stations.length) {
    loadBundledData();
    return;
  }
  // Stations aus IDB restored — kein bundled-fallback nötig
  Multi.stations = stations;
  Multi.activeSN = stations[0].sn;
  populateSelector();
  window.ELMI.app.applyDB(stations[0].db, stations[0].fileName);
  // Status-Hinweis im Settings-Tab anzeigen (sobald injiziert)
  var ts = fmtTimestamp(localStorage.getItem('elmi_last_upload'));
  var showRestoreHint = function(){
    var statusEl = document.getElementById('elmi-folder-status');
    if (statusEl) {
      showStatus(statusEl, 'ℹ️ Daten aus letztem Upload geladen — ' + ts, 'info');
    }
  };
  // Sofort versuchen, und auch nach Injection des Settings-Tab
  showRestoreHint();

/* Render timing for the Settings tab is unreliable to patch via function-wrap
   (it's often the very first tab rendered, before our hook installs). Instead,
   watch #content like the Financial Performance extension does and inject
   directly into whatever .page DOM is already there. */
function tryInject(){
  if (location.hash !== '#input' && location.hash !== '') return;
  var page = document.querySelector('#content .page');
  if (!page) return;
  injectIntoInputPage(page);
}

function startWatching(){
  var contentEl = document.getElementById('content');
  if (!contentEl) return false;
  var obs = new MutationObserver(function(){ tryInject(); });
  obs.observe(contentEl, {childList: true, subtree: true});
  window.addEventListener('hashchange', tryInject);
  tryInject();
  return true;
}

/* ================= Zeitzonen-Helfer (DST-korrekt) ================= *
 * Ausschliesslich diese Funktionen rechnen Zeit um. Niemals
 * getTimezoneOffset() (das ist die Browserzone, nicht die gewaehlte).  */
function tzOffsetMs(instant, tz){
  var dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  var p = {};
  dtf.formatToParts(instant).forEach(function(x){ p[x.type] = x.value; });
  var asUtc = Date.UTC(p.year, p.month - 1, p.day, (p.hour === '24' ? 0 : p.hour), p.minute, p.second);
  return asUtc - instant.getTime();
}
/* Offset-Cache pro voller Stunde: DST-Wechsel liegen auf Stundengrenzen,
   damit bleibt die Umrechnung exakt und schnell (statt 40k Intl-Aufrufe). */
var _offCache = {};
function offsetForMs(ms, tz){
  if (tz === 'UTC') return 0;
  var hourKey = tz + '|' + Math.floor(ms / 3600000);
  var c = _offCache[hourKey];
  if (c != null) return c;
  var off = tzOffsetMs(new Date(ms), tz);
  _offCache[hourKey] = off;
  return off;
}
/* Wanduhrzeit in der gewaehlten Zone -> UTC-Instant. Zwei Durchlaeufe wegen DST. */
function zonedToUtc(y, m, d, h, min, tz){
  if (tz === 'UTC') return new Date(Date.UTC(y, m - 1, d, h, min));
  var naive = Date.UTC(y, m - 1, d, h, min);
  var ts = naive - tzOffsetMs(new Date(naive), tz);
  ts = naive - tzOffsetMs(new Date(ts), tz);
  return new Date(ts);
}
/* Kalender-Datum "heute" in der gewaehlten Zone als {y,m,d}. */
function zonedToday(tz){
  var p = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  return { y: +p.year, m: +p.month, d: +p.day };
}

function tzShort(tz){

    var parts = new Intl.DateTimeFormat('de-DE', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date());
    var z = parts.filter(function(p){ return p.type === 'timeZoneName'; })[0];

/* ============ Display-Shift + applyDB-Patch (Kern bleibt UTC) ====== *
 * Der Kern zeigt Zeiten via getUTC*(). Wir uebergeben ihm daher eine
 * Projektion, in der jeder t-Wert um den Zonen-Offset verschoben ist.
 * Der kanonische UTC-Wert bleibt in r._utc erhalten; gespeichert wird
 * immer nur die kanonische (unverschobene) DB.                         */
function projectDbToZone(db, tz){
  if (!db || !Array.isArray(db.rows)) return db;
  var rows = db.rows.map(function(r){
    var utc = (r._utc != null ? r._utc : r.t);
    return Object.assign({}, r, { t: utc + offsetForMs(utc, tz), _utc: utc });
  });
  return Object.assign({}, db, { rows: rows });
}

}

/* ================= gemeinsame IndexedDB-Persistenz ================= *
 * Schreibt in denselben Store wie der Excel-Pfad: elmi_cpo_db ->
 * stations_data -> Schluessel 'last_stations' (Array {sn,fileName,db}). */
var PERSIST_DB = 'elmi_cpo_db', PERSIST_STORE = 'stations_data', PERSIST_KEY = 'last_stations';
function openPersistDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(PERSIST_DB, 1);
    req.onupgradeneeded = function(e){
      var d = e.target.result;
      if (!d.objectStoreNames.contains(PERSIST_STORE)) d.createObjectStore(PERSIST_STORE);
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
}
function idbGet(db, store, key){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readonly');
    var r = tx.objectStore(store).get(key);
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(e){ rej(e.target.error); };
  });
}
function idbPut(db, store, val, key){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = res;
    tx.onerror = function(e){ rej(e.target.error); };
  });
}
function safeSerialize(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return null; } }

/* Stationen aus einem Fetch mergen (idempotent nach SN) und speichern.
   Bestehende Stationen bleiben erhalten; gleiche SN wird ersetzt. */
async function persistApiStations(stationMap){
  try{
    var db = await openPersistDB();
    var existing = (await idbGet(db, PERSIST_STORE, PERSIST_KEY)) || [];
    var bySn = {};
    existing.forEach(function(s){ if (s && s.sn) bySn[s.sn] = s; });
    Object.keys(stationMap).forEach(function(sn){
      bySn[sn] = { sn: sn, fileName: 'Live API', db: safeSerialize(stationMap[sn]) };
    });
    var merged = Object.keys(bySn).map(function(k){ return bySn[k]; }).filter(function(s){ return s && s.db; });
    await idbPut(db, PERSIST_STORE, merged, PERSIST_KEY);

function apiRowsToRows(apiRows){

    if (isNaN(t)) return;
    var ff = function(raw, key){ var v = num(raw); return (v == null && last) ? last[key] : v; };
    var o = {
      t: t,
      ac_kwh: ff(r.acMeter, 'ac_kwh'),      ac_kw: num(r.acPower) || 0,
      bat_soc: ff(r.batterySoc, 'bat_soc'), bat_kw: num(r.batteryPower) || 0,
      g1_kwh: ff(r.gun1DcMeter, 'g1_kwh'),  g1_soc: ff(r.gun1Soc, 'g1_soc') || 0, g1_kw: num(r.gun1RealPwr) || 0, g1_st: statusRaw(r.gun1GunStatus),

      gap: num(r.gun1DcMeter) == null && num(r.gun2DcMeter) == null,
      source: 'api'
